<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CRM Nahuel</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">   <!-- con esta, iOS informa el alto de la zona de la hora y .tope-ios la tapa -->
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#14231D">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Marca Nahuel Lim (BRAND.md), version app: todo en Inter */
  :root {
    --crema:#F7F4EC; --blanco:#FFFFFF; --verde-claro:#E3EEE9; --linea:#DDD6C6; --tinta:#14231D; --tinta-suave:#434C47;
    --verde:#006A4E; --verde-profundo:#005941; --dorado:#BEAF87; --dorado-oscuro:#5B4700;
    --alerta:#7A1F14; --alerta-fondo:#F6E3E0;
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* html oscuro: el iPhone toma ese color para la franja de arriba (sin esfumado claro) */
  html { background:var(--tinta); }
  html, body { overscroll-behavior-y:none; }   /* sin 'tirar para recargar' del navegador: para actualizar, tocá Hoy */
  body { min-height:100vh; }
  html, body { margin:0; color:var(--tinta); font:16px/1.45 Inter, -apple-system, system-ui, sans-serif; }
  input, select, textarea, button { font:inherit; font-size:16px; color:inherit; }   /* 16px: iOS no hace zoom */

  /* Fondo oscuro detrás de todo: iOS 26 (app de pantalla de inicio) toma de acá el color de la zona de la hora.
     El contenido sigue en crema: main pinta crema a los costados y hasta abajo. */
  body { background:var(--tinta); }
  main { background:var(--crema); box-shadow:0 0 0 100vmax var(--crema); clip-path:inset(0 -100vmax); min-height:calc(100vh - 60px); }
  .tope-ios { position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top, 0px); background:var(--tinta); z-index:60; pointer-events:none; }
  .top { position:relative; z-index:50; background:var(--tinta); color:var(--crema); padding:calc(var(--top) + 6px) 16px 6px; display:flex; align-items:center; gap:12px; }
  .top img { height:26px; display:block; }
  .calif { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 12px; }
  .calif small { display:block; font-size:12px; color:var(--tinta-suave); }
  .calif span { font-weight:600; }
  .calif .falta { color:#9b2c2c; font-weight:500; }
  .item.visita { flex-wrap:wrap; }
  .item.visita .cuerpo { flex:1 1 100%; cursor:pointer; }
  .item.visita .texto { font-size:14px; color:var(--tinta-suave); margin-top:6px; white-space:pre-wrap; }
  .item.visita .btn { flex:1 1 100%; margin-top:10px; }
  table.est { width:100%; border-collapse:collapse; font-size:14px; }
  table.est th, table.est td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--linea); }
  table.est td.n, table.est th.n { text-align:right; white-space:nowrap; }
  .top .fecha { margin-left:auto; font-size:13px; color:var(--dorado); }
  .top .burger { background:none; border:0; color:var(--crema); width:44px; height:44px; display:flex; align-items:center; justify-content:center; margin-right:-8px; }
  .top .burger svg { width:26px; height:26px; }
  /* Menu lateral */
  #velo { position:fixed; inset:0; z-index:70; background:rgba(20,35,29,.45); display:none; }
  #velo.on { display:block; }
  #menu { position:fixed; top:0; right:0; bottom:0; z-index:71; width:min(320px, 86vw); background:var(--crema); transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; padding:calc(var(--top) + 12px) 0 calc(var(--bottom) + 12px); }
  #menu.on { transform:none; }
  #menu .cab { display:flex; align-items:center; justify-content:space-between; padding:0 12px 12px 20px; border-bottom:1px solid var(--linea); }
  #menu .cab img { height:28px; }
  #menu .cab button { background:none; border:0; width:44px; height:44px; color:var(--tinta); }
  #menu .cab svg { width:24px; height:24px; }
  #menu .grupo { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-suave); padding:18px 20px 6px; }
  #menu a, #menu .op { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 20px; color:var(--tinta); text-decoration:none; font-weight:500; background:none; border:0; width:100%; text-align:left; cursor:pointer; }
  #menu a { flex-direction:column; align-items:flex-start; gap:2px; }
  #menu a small { color:var(--tinta-suave); font-weight:400; font-size:13px; }
  #menu a:active, #menu .op:active { background:var(--verde-claro); }
  #menu .abajo { margin-top:auto; border-top:1px solid var(--linea); }
  #menu .salir { color:var(--alerta); }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--tinta); display:flex; padding-bottom:var(--bottom); }
  nav.tabs button { flex:1; background:none; border:0; color:var(--crema); padding:12px 0 10px; font-size:13px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav.tabs button.on { color:var(--dorado); }
  nav.tabs svg { width:22px; height:22px; }

  main { padding:12px 16px calc(84px + var(--bottom)); max-width:720px; margin:0 auto; }
  .aviso { background:var(--alerta-fondo); color:var(--alerta); border-radius:12px; padding:12px 14px; margin:8px 0; font-size:14px; }

  .resumen { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:4px 0 8px; }
  .resumen div { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:10px 2px; text-align:center; min-width:0; }
  .resumen b { display:block; font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .resumen span { font-size:11px; color:var(--tinta-suave); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-suave); margin:20px 4px 8px; }
  .item { background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .item .cuerpo { flex:1; min-width:0; }
  .item .nombre { font-weight:600; }
  .item .meta { font-size:14px; color:var(--tinta-suave); margin-top:2px; }
  .item .porque { font-size:14px; font-weight:600; margin-top:6px; }
  .item .jugada { font-size:14px; color:var(--verde-profundo); margin-top:2px; }
  .item .texto { font-size:14px; color:var(--tinta-suave); margin-top:6px; white-space:pre-wrap; }
  .item svg { width:18px; height:18px; color:var(--tinta-suave); flex:none; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .tags:empty { display:none; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--verde-claro); color:var(--verde-profundo); }
  .pill.alerta { background:var(--alerta-fondo); color:var(--alerta); }
  .pill.oro { background:#F1ECDD; color:var(--dorado-oscuro); }
  .vacio { color:var(--tinta-suave); font-size:14px; padding:4px; }

  .btn { border:1px solid var(--linea); background:var(--blanco); border-radius:12px; padding:11px 14px; min-height:46px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, color .15s; }
  .btn:active { transform:scale(.98); }
  .btn.pri { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); }
  .btn.sec { background:var(--verde-claro); border-color:var(--verde-claro); color:var(--verde-profundo); }
  .btn.peligro { background:none; border-color:var(--alerta-fondo); color:var(--alerta); }
  .btn.marcado { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); font-weight:600; }
  .btn.marcado::before { content:'✓'; }
  .btn svg { width:20px; height:20px; }
  .btn.ancho { width:100%; }
  .chip { border:1px solid var(--linea); background:var(--blanco); border-radius:999px; padding:7px 12px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); }
  .chip.on::after { content:' ×'; }
  .chip.seg.on::after { content:none; }
  .chip.chico { padding:4px 10px; font-size:13px; }
  .item .botones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .item .botones .btn { padding:10px 12px; font-size:14px; flex:1 1 40%; justify-content:center; }
  .rojo { color:var(--alerta); font-weight:600; }
  .sobre { font-size:14px; background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:8px 12px; margin-bottom:10px; white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .sobre.abierto { display:block; }
  .sugerencia { background:var(--verde-claro); border-radius:12px; padding:10px 12px; margin:12px 0; font-size:14px; }
  /* v29: tarjeta con jerarquía. Rojo = urgente, verde = se toca, gris = dato */
  .t { background:var(--blanco); border:1px solid var(--linea); border-radius:16px; padding:14px 14px 12px; margin-bottom:10px; cursor:pointer; }
  .t.urge { border-left:4px solid var(--alerta); }
  .t .f1 { display:flex; align-items:baseline; gap:8px; }
  .t .nom { font-size:17px; font-weight:700; letter-spacing:-.01em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t .dias { margin-left:auto; font-size:13px; color:var(--tinta-suave); white-space:nowrap; }
  .t .dias.rojo { color:var(--alerta); font-weight:700; }
  .t .busca { font-size:14px; color:var(--tinta-suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .t .dato { font-size:13px; color:var(--tinta-suave); margin-top:2px; }
  .t .porque { font-size:15px; font-weight:600; margin-top:10px; }
  .t .sug { font-size:14px; color:var(--verde-profundo); margin-top:2px; }
  .t .nota1 { font-size:13px; color:var(--tinta-suave); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-style:italic; }
  .t .acc { display:flex; gap:8px; margin-top:12px; }
  .t .acc .btn { flex:1; min-height:48px; font-weight:600; font-size:15px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:1px; background:var(--linea); }
  .dot.CALIENTE { background:#C0392B; } .dot.TIBIO { background:#C9A227; } .dot.FRIO { background:#4A7FA7; }
  .seg3 { display:flex; border:1px solid var(--linea); border-radius:12px; overflow:hidden; background:var(--blanco); }
  .seg3 button { flex:1; min-height:44px; border:0; background:none; font-size:15px; font-weight:600; color:var(--tinta-suave); cursor:pointer; }
  .seg3 button + button { border-left:1px solid var(--linea); }
  .seg3 button.on { background:var(--verde-profundo); color:var(--crema); }
  .seg3.pide { border-color:var(--alerta); }
  .pide-txt { font-size:13px; color:var(--alerta); font-weight:600; margin:12px 0 6px; }
  .t .msg { font-size:14px; background:var(--crema); border-radius:10px; padding:10px 12px; margin-top:10px; white-space:pre-wrap; }
  .t .enfoques { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  details.semana { background:var(--blanco); border:1px solid var(--linea); border-radius:16px; margin:4px 0 10px; }
  details.semana summary { list-style:none; padding:14px; font-weight:700; font-size:16px; display:flex; align-items:center; cursor:pointer; }
  details.semana summary::-webkit-details-marker { display:none; }
  details.semana summary::after { content:'›'; margin-left:auto; font-size:20px; color:var(--tinta-suave); transition:transform .15s; }
  details.semana[open] summary::after { transform:rotate(90deg); }
  .semana .dia { padding:0 14px 10px; }
  .semana .dia h4 { margin:10px -14px 4px; padding:7px 14px; font-size:15px; font-weight:700; color:var(--tinta); background:var(--crema); border-top:1px solid var(--linea); border-bottom:1px solid var(--linea); }
  .semana .dia h4.hoy { background:var(--verde-claro); color:var(--verde-profundo); }
  .semana .dia h4 small { font-weight:500; color:var(--tinta-suave); margin-left:6px; font-size:13px; }
  .semana .ev b { font-weight:700; }
  .semana .ev { display:flex; gap:10px; padding:8px 0 8px 10px; font-size:14px; border-left:3px solid var(--linea); margin:4px 0; }
  .semana .ev.evento { border-left-color:var(--verde); }
  .semana .ev .h { width:44px; flex:none; color:var(--tinta-suave); font-variant-numeric:tabular-nums; }
  .semana .ev .c { margin-left:auto; flex:none; font-size:12px; color:var(--tinta-suave); }
  .semana .ev.evento { color:var(--verde-profundo); }
  .semana .nada { font-size:13px; color:var(--tinta-suave); padding:2px 0 4px; }
  details.blk > summary { list-style:none; cursor:pointer; }
  details.blk > summary::-webkit-details-marker { display:none; }
  details.blk > summary .bloque::after { content:'›'; font-size:20px; color:var(--tinta-suave); transition:transform .15s; margin-left:8px; }
  details.blk[open] > summary .bloque::after { transform:rotate(90deg); }
  details.blk.vacio > summary { opacity:.55; }
  .fecha-linda { position:relative; }
  .fecha-linda .ver { border:1px solid var(--linea); border-radius:12px; padding:11px 12px; background:var(--blanco); min-height:46px; font-weight:600; }
  .fecha-linda .ver.vacia { font-weight:400; color:#8A8F8B; }
  .fecha-linda input { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
  .bloque { display:flex; align-items:baseline; gap:8px; margin:22px 2px 8px; }
  .bloque h3 { margin:0; font-size:17px; letter-spacing:-.01em; text-transform:none; color:var(--tinta); }
  .bloque .c { font-size:13px; font-weight:700; color:var(--crema); background:var(--tinta); border-radius:999px; padding:1px 8px; }
  .bloque h3.rojo { color:var(--alerta); }
  .bloque small { margin-left:auto; text-align:right; font-size:13px; color:var(--tinta-suave); }
  .resumen div.alerta { border-color:var(--alerta); } .resumen div.alerta b { color:var(--alerta); }
  .grilla { display:grid; gap:8px; } .grilla.g2 { grid-template-columns:repeat(2,1fr); } .grilla.g3 { grid-template-columns:repeat(3,1fr); } .grilla.g4 { grid-template-columns:repeat(4,1fr); }
  .grilla .chip { white-space:pre-line; border-radius:12px; min-height:44px; padding:6px 4px; text-align:center; font-size:15px; }
  .grilla.g4 .chip { font-size:14px; }
  .grilla .ancho2 { grid-column:span 2; }
  .grilla .chip.dos { font-size:12px; line-height:1.15; }
  .deslizable { display:flex; gap:6px; overflow-x:auto; margin:10px -16px 4px; padding:0 16px 4px; scrollbar-width:none; }
  .deslizable::-webkit-scrollbar { display:none; }
  .deslizable .chip { white-space:nowrap; flex:none; }
  .grupo { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-suave); margin:16px 2px 6px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:8px; }
  .tile { background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:12px 6px 10px; text-align:center; cursor:pointer; }
  .tile b { display:block; font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.1; }
  .tile span { display:block; font-size:12px; color:var(--tinta-suave); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.alerta { border-color:var(--alerta); } .tile.alerta b { color:var(--alerta); }
  .tile.cero { opacity:.5; }
  .fila { display:flex; gap:8px; flex-wrap:wrap; }
  .fila > .btn { flex:1; min-width:0; padding:10px 6px; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .grid3 > .btn { min-width:0; padding:10px 4px; font-size:15px; gap:6px; }
  .grid3 > .btn svg { width:18px; height:18px; flex:none; }
  .ancho2 { grid-column:1/3; }
  a.btn { text-decoration:none; color:var(--tinta); display:flex; align-items:center; justify-content:center; }
  .grid2 > div { display:flex; flex-direction:column; }
  .grid2 > div > :last-child { margin-top:auto; }   /* las cajas de una fila quedan alineadas abajo aunque una tenga texto de ayuda */
  .guardar-fijo { position:sticky; bottom:0; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--crema) 30%); z-index:2; }
  .pregunta { font-size:13px; font-style:italic; color:var(--tinta-suave); margin:-2px 0 6px; }

  input, select, textarea { width:100%; border:1px solid var(--linea); border-radius:12px; padding:11px 12px; background:var(--blanco); }
  input[type=date], input[type=time] { -webkit-appearance:none; appearance:none; min-width:0; max-width:100%; display:block; min-height:46px; text-align:left; }
  select { -webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--tinta-suave) 50%),linear-gradient(135deg,var(--tinta-suave) 50%,transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--verde); outline-offset:0; border-color:transparent; }
  textarea { min-height:96px; resize:vertical; }
  label { display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin:10px 2px 4px; }
  .multi .elegidos { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .multi .opciones { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }

  /* Ficha */
  #ficha { display:none; position:fixed; inset:0; z-index:55; background:var(--crema); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #ficha.abierta { display:block; }
  .ficha-head { position:sticky; top:0; z-index:2; background:var(--tinta); color:var(--crema); padding:calc(var(--top) + 8px) 12px 0; }
  .ficha-head .barra { display:flex; align-items:center; gap:10px; }
  .icono { background:none; border:0; color:var(--crema); width:44px; height:44px; border-radius:22px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .icono svg { width:24px; height:24px; }
  .ficha-head h1 { font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1.2; margin:0; flex:1; min-width:0; }
  .ficha-head .mono { height:26px; flex:none; opacity:.95; }
  .etiqueta { margin:6px 4px 0; display:flex; align-items:center; gap:10px; font-size:14px; }
  .etiqueta span { flex:1; opacity:.88; }
  .etiqueta button { background:rgba(247,244,236,.12); border:0; color:var(--dorado); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; white-space:nowrap; }
  .estado-linea { display:flex; flex-wrap:wrap; gap:6px; margin:10px 4px 0; }
  .estado-linea .pill { background:rgba(247,244,236,.12); color:var(--crema); }
  .segmentos { display:flex; gap:4px; overflow-x:auto; margin:12px -12px 0; padding:0 12px; scrollbar-width:none; }
  .segmentos::-webkit-scrollbar { display:none; }
  .segmentos button { background:none; border:0; color:var(--crema); opacity:.75; padding:10px 12px 12px; font-size:15px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; }
  .segmentos button.on { opacity:1; color:var(--dorado); border-bottom-color:var(--dorado); }
  .segmentos .n { font-size:11px; background:var(--dorado); color:var(--tinta); border-radius:999px; padding:1px 6px; margin-left:4px; }
  .ficha-body { padding:16px 16px calc(32px + var(--bottom)); max-width:720px; margin:0 auto; }
  .card { background:var(--blanco); border:1px solid var(--linea); border-radius:16px; padding:14px; margin:12px 0; }
  .card > h3 { margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-suave); }

function el(tag, attrs, ...hijos) {

    if (v === undefined || v === null || v === false) return;

const cfg = () => ({ url: localStorage.getItem(LS.url), key: localStorage.getItem(LS.key) });

const SOLO_LEE = ['api_hoy', 'api_ficha', 'api_buscar', 'api_estadisticas'];
async function api(fn, ...args) {
  const { url, key } = cfg();
  pendientes++; document.getElementById('cargando').style.display = 'block';
  try {
    // "Load failed": el iPhone corta la conexión cuando la app pasa a segundo plano (WhatsApp, llamada).
    // Lo que solo lee se reintenta solo. Lo que guarda NO, para no registrar dos veces el mismo mensaje.
    const soloLee = SOLO_LEE.includes(fn);
    let res;
    for (let i = 0; ; i++) {
      try { res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, k: key }) }); break; }
      catch (e) {
        if (!soloLee || i >= 2) { e.red = true; throw e; }
        await new Promise(ok => setTimeout(ok, 1500));
      }
    }
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'no autorizado') { pantallaConfig('La clave no es válida. Volvé a cargarla.'); }
      throw new Error(j.error);
    }
    return j.data;
  } catch (e) {
    if (e.red) { if (document.visibilityState === 'visible') toast(SOLO_LEE.includes(fn) ? 'Sin conexión. Probá de nuevo en un momento.' : 'Sin conexión: puede que no se haya guardado. Revisalo en el Historial.'); }

    if (--pendientes <= 0) { pendientes = 0; document.getElementById('cargando').style.display = 'none'; }

function select(opciones, valor, etiquetas) {
  const ops = opciones.includes(valor) || !valor ? opciones : [...opciones, valor];   // no perder valores viejos
  const s = el('select');
  ops.forEach((o, i) => s.append(el('option', { value:o, selected: o === valor ? '' : undefined }, (etiquetas && etiquetas[i]) || o || '—')));
  return s;
}
// Seleccion multiple con chips. buscador: true muestra un campo para filtrar (para listas largas como barrios).
function multi(opciones, valorStr, buscador) {
  const elegidos = String(valorStr || '').split(',').map(x => x.trim()).filter(Boolean);
  const todas = [...new Set([...opciones, ...elegidos])];
  const nodo = el('div', { cls:'multi' }), arriba = el('div', { cls:'elegidos' }), abajo = el('div', { cls:'opciones' });
  const filtro = buscador ? el('input', { type:'search', placeholder:'Buscar barrio', autocomplete:'off' }) : null;
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pintar = () => {
    arriba.replaceChildren(...elegidos.map(o => el('button', { cls:'chip on', type:'button', onclick: () => { elegidos.splice(elegidos.indexOf(o), 1); pintar(); } }, o)));
    const q = filtro ? norm(filtro.value.trim()) : '';
    const libres = todas.filter(o => !elegidos.includes(o) && (!buscador || (q && norm(o).includes(q))));
    abajo.replaceChildren(...libres.slice(0, 15).map(o => el('button', { cls:'chip', type:'button', onclick: () => { elegidos.push(o); if (filtro) filtro.value = ''; pintar(); } }, o)));
    if (buscador && !q) abajo.replaceChildren(el('span', { cls:'vacio' }, elegidos.length ? '' : 'Escribí para buscar barrios.'));
  };
  if (filtro) filtro.addEventListener('input', pintar);
  nodo.append(arriba, filtro || '', abajo); pintar();
  nodo.valor = () => elegidos.join(', ');
  return nodo;
}
function aISO(ddmmyyyy) { const m = String(ddmmyyyy || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }

// Formulario de campos del Sheet con el control adecuado a cada campo; devuelve { nodo, cambios() }
function formulario(d, campos, listas, anchos) {
  const ctrl = {};
  let ambMax;
  const control = k => {
    const v = d[k] || '';
    const sel = ops => { const s = select(ops, v); return { nodo:s, valor:() => s.value }; };
    if (k === 'BUSCA TIPO' || k === 'VENDE TIPO') { const m = multi(TIPOS, v); return { nodo:m, valor:m.valor }; }
    if (k === 'BUSCA BARRIOS') { const m = multi(listas.barrios || [], v, true); return { nodo:m, valor:m.valor, ancho:true }; }
    if (k === 'VENDE BARRIO') return sel(['', ...(listas.barrios || [])]);
    if (/AMB/.test(k)) {                                                   // en el iPhone se ve como rueda
      const s = select(AMBS, v === '5' ? '5+' : v, AMBS_TXT);
      if (k === 'BUSCA AMB MAX') ambMax = s;
      if (k === 'BUSCA AMB MIN') s.addEventListener('change', () => {
        const sug = AMB_MAX_SUGERIDO[s.value];
        if (ambMax && sug && (!ambMax.value || parseInt(ambMax.value) < parseInt(s.value))) ambMax.value = sug;
      });
      return { nodo:s, valor:() => s.value };
    }
    if (k === 'URGENCIA') return sel(['', ...(listas.urgencias || [])]);
    if (k === 'MOTIVACION') return sel(['', ...(listas.motivaciones || [])]);
    if (k === 'BUSCA FORMA DE PAGO') return sel(['','PARTE DE PAGO','VENTA','CASH','CREDITO APROBADO','CREDITO EN TRAMITE','CREDITO SIN CONFIRMAR']);
    if (k === 'BUSCA COCHERA') return sel(['','SI','NO','DESEABLE']);
    if (k === 'FUENTE') return sel(['', ...FUENTES]);
    if (k === 'ROL') return sel(['','COMPRADOR','VENDEDOR','AMBOS']);
    if (k === 'TEMPERATURA') return sel(['','CALIENTE','TIBIO','FRIO']);
    if (k === 'RELACION') { const s = select(['','A','B','C'], v, ['No','A · cada 30 días','B · cada 60 días','C · cada 90 días']); return { nodo:s, valor:() => s.value }; }
    if (k === 'CUMPLEANOS' || /FECHA|DESDE|AUTORIZACION/.test(k)) { const i = el('input', { type:'date', value: aISO(v) }); return { nodo:i, valor:() => i.value, orig: aISO(v) }; }
    if (/USD/.test(k)) { const i = el('input', { inputmode:'numeric', value:v }); return { nodo:i, valor:() => i.value.replace(/\D/g, '') }; }
    if (k === 'OTRA INMO LINK') { const i = el('input', { type:'url', value:v, placeholder:'https://www.zonaprop.com.ar/...' }); return { nodo:i, valor:() => i.value.trim(), ancho:true }; }
    if (k === 'NOTAS' || k === 'BUSCA REQUISITOS') { const t = el('textarea', { style:'min-height:64px' }); t.value = v; return { nodo:t, valor:() => t.value, ancho:true }; }
    const i = el('input', { value:v }); return { nodo:i, valor:() => i.value };
  };
  const nodo = el('div', { cls:'grid2' }, ...campos.map(k => {
    const c = control(k); ctrl[k] = c;
    return el('div', { cls: c.ancho || (anchos || []).includes(k) ? 'ancho2' : '' }, el('label', {}, ETIQ(k)), PREGUNTAS[k] && CAMPOS_CALIF.includes(k) ? el('div', { cls:'pregunta' }, PREGUNTAS[k]) : '', c.nodo);
  }));
  return { nodo, cambios: () => { const r = {}; Object.entries(ctrl).forEach(([k, c]) => { const orig = c.orig !== undefined ? c.orig : String(d[k] || ''); if (c.valor() !== orig) r[k] = c.valor(); }); return r; } };
}

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const azar = n => crypto.getRandomValues(new Uint8Array(n));
async function activarFaceId() {
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: azar(32), rp: { name:'CRM Nahuel', id: location.hostname },
    user: { id: azar(16), name:'nahuel', displayName:'Nahuel Lim' },
    pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
    authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' }, timeout: 60000 } });
  localStorage.setItem(LS.cred, b64(cred.rawId));
}
async function verificarFaceId() {
  await navigator.credentials.get({ publicKey: { challenge: azar(32), allowCredentials: [{ type:'public-key', id: unb64(localStorage.getItem(LS.cred)) }], userVerification:'required', timeout: 60000 } });
}
function pantallaBloqueo() {

      localStorage.removeItem(LS.cred); localStorage.removeItem(LS.key);

}

  const url = el('input', { placeholder:'https://script.google.com/macros/s/.../exec', autocomplete:'off', value: localStorage.getItem(LS.url) || '' });
  const key = el('input', { type:'password', placeholder:'Clave', autocomplete:'off' });
  b.replaceChildren(el('img', { src:'../assets/nl-mono-crema.svg', alt:'NL' }),
    el('div', { cls:'s' }, msg || 'Configuración de este dispositivo. Se hace una sola vez.'),
    el('div', { style:'width:100%;max-width:360px;text-align:left' }, el('label', { style:'color:var(--dorado)' }, 'URL de la app web'), url, el('label', { style:'color:var(--dorado)' }, 'Clave'), key),
    el('button', { cls:'btn pri', onclick: async () => {
      localStorage.setItem(LS.url, url.value.trim()); localStorage.setItem(LS.key, key.value.trim());
      try {
        await api('api_hoy');
        if (window.PublicKeyCredential && !localStorage.getItem(LS.cred) && confirm('¿Activar Face ID para abrir la app?')) {
          try { await activarFaceId(); } catch (e) { toast('Face ID no se activó: ' + e.message, true); }
        }
        b.classList.remove('on'); arrancar();
      } catch (e) { localStorage.removeItem(LS.key); }

let ocultoDesde = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { ocultoDesde = Date.now(); marcarActivo(); return; }
  if (localStorage.getItem(LS.cred) && ocultoDesde && Date.now() - ocultoDesde > BLOQUEO_MIN * 60000) return pantallaBloqueo();
  setTimeout(refrescar, 800);                        // al volver de WhatsApp o del telefono (la red tarda en despertar)
});

// ─── listas ───
// Tarjeta: quién es, de dónde vino, cuánto hace que no hablan, por qué aparece hoy y qué hacer.
// o.temp: chips de temperatura (compradores). o.botones: acciones sin abrir la ficha.
const RITMO_MAX = { CALIENTE:2, TIBIO:5, FRIO:12 };
const TEMPS = [['CALIENTE','Caliente'],['TIBIO','Tibio'],['FRIO','Frío']];
function chipsTemp(x) {
  const t = String(x.temp || '').toUpperCase();
  const fila = el('div', { cls:'fila', style:'margin-top:8px;gap:6px', onclick: e => e.stopPropagation() },
    ...TEMPS.map(([k, txt]) => el('button', { cls:'chip seg chico' + (t === k ? ' on' : ''), type:'button', onclick: async e => {
      const b = e.currentTarget;
      fila.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); b.classList.add('on');
      sin.remove(); x.temp = k;
      await api('api_guardar', x.id, { TEMPERATURA: k }); toast('Temperatura: ' + txt);
    }}, txt)));
  const sin = t ? el('span') : el('span', { cls:'pill alerta' }, 'Sin temperatura');
  fila.append(sin);
  return fila;
}
function sinHablar(x) {
  if (x.diasSin === null || x.diasSin === undefined) return x.ultimo ? 'último: ' + x.ultimo : 'sin contactos registrados';
  const tope = RITMO_MAX[String(x.temp || '').toUpperCase()];
  const txt = x.diasSin === 0 ? 'hablaron hoy' : 'hace ' + x.diasSin + (x.diasSin === 1 ? ' día' : ' días') + ' sin hablar';
  return el('span', { cls: tope && x.diasSin > tope ? 'rojo' : '' }, txt);
}
// Tarjeta v29: quién y hace cuánto · qué busca · dato (temperatura, P, etapa) · por qué hoy · sugerencia · nota en una línea · hasta 2 botones.
// o.temp: si es comprador y no tiene temperatura, el selector grande. o.botones: acciones sin abrir la ficha. o.extra: línea extra.
function selectorTemp(x, alElegir) {
  const t = String(x.temp || '').toUpperCase();
  const s3 = el('div', { cls:'seg3' + (t ? '' : ' pide'), onclick: e => e.stopPropagation() }, ...TEMPS.map(([k, txt]) => el('button', { type:'button', cls: t === k ? 'on' : '', onclick: async e => {
    s3.querySelectorAll('button').forEach(b => b.classList.remove('on')); e.currentTarget.classList.add('on'); s3.classList.remove('pide');
    if (alElegir) return alElegir(k);
    x.temp = k; await api('api_guardar', x.id, { TEMPERATURA: k }); toast('Temperatura: ' + txt);
  }}, txt)));
  return s3;
}
function urgente(x) {
  const tope = RITMO_MAX[String(x.temp || '').toUpperCase()];
  return !!(x.deuda || x.urgente || x.atrasado > 0 || (tope && x.diasSin > tope));
}
function item(x, tag, o) {
  o = o || {};
  const temp = String(x.temp || '').toUpperCase();
  const tope = RITMO_MAX[temp];
  const dias = x.diasSin === null || x.diasSin === undefined ? (x.ultimo ? '' : 'sin contactos') : x.diasSin === 0 ? 'hoy' : x.diasSin === 1 ? 'ayer' : x.diasSin + ' días sin hablar';
  const dato = [temp ? el('span', {}, el('span', { cls:'dot ' + temp }), temp.charAt(0) + temp.slice(1).toLowerCase()) : '',
    x.prio ? 'P' + x.prio : '', tag || '', x.deuda ? el('span', { cls:'rojo' }, 'Mandale opciones') : '', x.urgente ? el('span', { cls:'rojo' }, 'Fecha límite') : '',
    x.tel ? '' : el('span', { cls:'rojo' }, 'Sin teléfono')].filter(Boolean);
  const linea = []; dato.forEach((d, i) => { if (i) linea.push(' · '); linea.push(d); });
  const pideTemp = o.temp && !temp;
  return el('div', { cls:'t' + (urgente(x) ? ' urge' : ''), onclick: () => abrir(x.id, 'contacto') },
    el('div', { cls:'f1' }, el('span', { cls:'nom' }, String(x.nombre).split(' - ')[0]), dias ? el('span', { cls:'dias' + (tope && x.diasSin > tope ? ' rojo' : '') }, dias) : ''),
    x.resumen ? el('div', { cls:'busca' }, x.resumen) : (x.fuente ? el('div', { cls:'busca' }, 'Lead de ' + x.fuente + (x.alta ? ' · entró el ' + x.alta.slice(0, 5) : '')) : ''),
    linea.length ? el('div', { cls:'dato' }, ...linea) : '',
    o.extra || '',
    x.porque ? el('div', { cls:'porque' }, x.porque) : (x.accion ? el('div', { cls:'porque' }, [x.accion, x.prox].filter(Boolean).join(' · ')) : ''),
    x.jugada ? el('div', { cls:'sug' }, 'Sugerencia: ' + x.jugada) : '',
    x.nota ? el('div', { cls:'nota1' }, '“' + x.nota + '”') : '',
    pideTemp ? [el('div', { cls:'pide-txt' }, 'Falta la temperatura'), selectorTemp(x)] : '',
    o.botones && o.botones.filter(Boolean).length ? el('div', { cls:'acc', onclick: e => e.stopPropagation() }, ...o.botones.filter(Boolean)) : '');
}
// El mismo orden en todas las listas: temperatura → forma de pago (P1 primero) → el que hace más que no hablan
const ORDEN_TEMP = { CALIENTE:0, TIBIO:1, FRIO:2 };
const ordenar = xs => xs.slice().sort((a, b) =>
  (ORDEN_TEMP[String(a.temp || '').toUpperCase()] ?? 3) - (ORDEN_TEMP[String(b.temp || '').toUpperCase()] ?? 3)
  || (a.prio || 9) - (b.prio || 9)
  || (b.diasSin ?? 9999) - (a.diasSin ?? 9999));
// Botones de las tarjetas de Hoy
const bLlamar = x => x.wa ? el('button', { cls:'btn pri', icon:'tel', onclick: () => abrirExterno('tel:+' + x.wa) }, 'Llamar') : '';
const bWhatsApp = x => x.wa ? el('button', { cls:'btn sec', icon:'wa', onclick: () => abrirExterno(waUrl(x.wa)) }, 'WhatsApp') : '';
const bNoContesto = x => el('button', { cls:'btn', onclick: async e => {
  e.currentTarget.closest('.t').style.opacity = .4;
  await api('api_accion', x.id, 'LLAMADA_NO'); toast('Registrado: no contestó'); verHoy();
}}, 'No contestó');
// Leads: al tocar Llamar, la tarjeta pregunta qué pasó (Atendió abre la ficha con "Llamada" ya elegida)
const bLlamarLead = x => x.wa ? el('button', { cls:'btn pri', icon:'tel', onclick: e => {

}}, 'Llamar') : '';
const bAbrir = (x, t, pri) => el('button', { cls:'btn' + (pri ? ' pri' : ''), onclick: () => abrir(x.id, 'contacto') }, t);

// Checklist (revivir, relación, cumpleaños): el mensaje ya elegido, se puede cambiar, Enviar y listo. Sin abrir la ficha.
// Tarjeta de envío (cumpleaños, fiestas, mensajes, relación, revivir): mismo formato que las demás, con el mensaje listo y Enviar.
function tarjetaEnvio(x, texto0, enviar, chips) {
  const texto = el('div', { cls:'msg' }, texto0);
  const t = el('div', { cls:'t', onclick: () => abrir(x.id, 'contacto') },
    el('div', { cls:'f1' }, el('span', { cls:'nom' }, String(x.nombre).split(' - ')[0]), x.cuando ? el('span', { cls:'dias' }, x.cuando) : ''),
    x.resumen ? el('div', { cls:'busca' }, x.resumen) : '',
    x.evento ? el('div', { cls:'busca' }, x.evento) : '',
    el('div', { cls:'porque' }, x.porque || x.accion || ''),
    x.ultimo ? el('div', { cls:'dato' }, 'Último: ' + x.ultimo) : '',
    chips || '', texto,
    el('div', { cls:'acc', onclick: e => e.stopPropagation() }, el('button', { cls:'btn sec', icon:'wa', onclick: async () => {
      if (!x.wa) return toast('Falta un teléfono válido', true);
      const tx = texto.textContent;
      if (/\{\w+\}/.test(tx)) return toast('Este mensaje tiene datos sin completar: abrí la ficha', true);
      abrirExterno(waUrl(x.wa, tx));
      t.style.opacity = .4;
      await enviar(tx); t.remove();
    }}, 'Enviar')));
  t.texto = texto;
  return t;
}
function filaEnvio(x) {
  const ops = x.opciones || [];
  let k = 0;
  const chips = ops.length > 1 ? el('div', { cls:'enfoques', onclick: e => e.stopPropagation() }, ...ops.map((o, i) => {
    const b = el('button', { cls:'chip seg chico' + (i === 0 ? ' on' : ''), type:'button', onclick: () => {
      k = i; t.texto.textContent = o.texto;
      b.parentNode.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); b.classList.add('on');
    }}, i === 0 ? 'Principal' : (o.enfoque || 'Otro enfoque').replace(/^Otro enfoque:\s*/, '').split('. ')[0]); return b; })) : '';
  const t = tarjetaEnvio(x, ops[0] ? ops[0].texto : '', tx => api('api_accion', x.id, 'MENSAJE', x.codigo + '-' + (k + 1), tx), chips);
  return t;
}

// Esta semana: tus próximos pasos y los eventos del calendario, día por día. Se pide recién al abrirla (Hoy carga igual de rápido).
// Esta semana: tus próximos pasos y los eventos del calendario, día por día. Se pide recién al abrirla y queda en memoria:
// cuando Hoy se actualiza, se vuelve a dibujar abierta y sin recargar.
let semanaAbierta = false, semanaDatos = null;
function pintarSemana(cuerpo, r) {
  cuerpo.replaceChildren(
    r.atrasados ? el('div', { cls:'dia' }, el('div', { cls:'rojo', style:'font-size:14px' }, r.atrasados + (r.atrasados === 1 ? ' paso atrasado' : ' pasos atrasados') + ': están en Tus próximos pasos.')) : '',
    ...r.dias.map((dia, i) => el('div', { cls:'dia' }, el('h4', { cls: i === 0 ? 'hoy' : '' }, dia.titulo, dia.items.length ? el('small', {}, dia.items.length + (dia.items.length === 1 ? ' cosa' : ' cosas')) : ''),
      dia.items.length ? dia.items.map(x => el('div', { cls:'ev' + (x.canal === 'Evento' ? ' evento' : ''), style: x.id ? 'cursor:pointer' : '', onclick: () => x.id && abrir(x.id, 'contacto') },
        x.hora ? el('span', { cls:'h' }, x.hora) : '', el('span', {}, x.nombre ? el('b', {}, x.nombre + ' · ') : '', x.texto), x.canal && x.canal !== 'Evento' ? el('span', { cls:'c' }, x.canal) : ''))
        : el('div', { cls:'nada' }, 'Nada agendado'))));
}
function semana() {
  const cuerpo = el('div');
  const d = el('details', { cls:'semana', open: semanaAbierta ? '' : undefined }, el('summary', {}, 'Esta semana'), cuerpo);
  if (semanaDatos) pintarSemana(cuerpo, semanaDatos);
  d.addEventListener('toggle', async () => {
    semanaAbierta = d.open;
    if (!d.open || semanaDatos) return;
    cuerpo.replaceChildren(el('div', { cls:'dia nada' }, 'Cargando…'));
    semanaDatos = await api('api_semana');
    pintarSemana(cuerpo, semanaDatos);

// Hoy se muestra al instante con lo último guardado en el dispositivo y se actualiza cuando contesta el servidor
// (Apps Script tarda 2 a 5 segundos). La clave ya vive en este dispositivo, así que guardar Hoy no expone nada nuevo.
const LS_HOY = 'crm_hoy_cache';
let hoyPedido = 0;
async function verHoy() {
  tabs('tHoy');
  const n = ++hoyPedido;
  try { const c = JSON.parse(localStorage.getItem(LS_HOY) || 'null'); if (c && c.dia === new Date().toLocaleDateString('sv')) pintarHoy(c.r, true); } catch (e) {}
  const r = await api('api_hoy');
  if (n !== hoyPedido || !document.getElementById('tHoy').classList.contains('on')) return;   // ya se fue a otra pantalla
  try { localStorage.setItem(LS_HOY, JSON.stringify({ dia: new Date().toLocaleDateString('sv'), r })); } catch (e) {}
  pintarHoy(r, false);
}
function pintarHoy(r, viejo) {
  const l = document.getElementById('lista');
  LINKS = r.links || {};
  l.replaceChildren();
  if (viejo) l.append(el('div', { cls:'actual', style:'margin:0 2px 6px' }, 'Actualizando…'));
  if (r.version !== VERSION) l.append(el('div', { cls:'aviso' }, 'El servidor (Code.gs) es la versión ' + (r.version || '?') + ' y la app es la ' + VERSION + '. Actualizá Code.gs y publicá una "Nueva versión".'));
  const L = k => r[k] || [];
  const hoyISO = new Date().toLocaleDateString('sv');
  // Cuántos muestra cada bloque (Llamar y Mensajes de a 5, Revivir de a 3) y qué bloques abriste: se recuerda en el día
  const estado = (() => { try { const e = JSON.parse(localStorage.getItem('crm_hoy_ui') || '{}'); return e.dia === hoyISO ? e : { dia: hoyISO, ver: {}, abiertos: {} }; } catch (e) { return { dia: hoyISO, ver: {}, abiertos: {} }; } })();
  const guardarEstado = () => localStorage.setItem('crm_hoy_ui', JSON.stringify(estado));
  const PASO = { llamar:5, mensajes:5, revivir:3 };

  const BLOQUES = [['proximos','Tuyos'],['opciones','Opciones'],['llamar','Llamar'],['mensajes','Mensajes'],['atento','Atento']];
  l.append(el('div', { cls:'resumen' }, ...BLOQUES.map(([k, t]) => el('div', { cls: L(k).some(urgente) ? 'alerta' : '', style:'cursor:pointer', onclick: () => {
    const d = document.getElementById('sec-' + k); d.open = true; d.scrollIntoView({ behavior:'smooth', block:'start' }); } },
    el('b', {}, L(k).length), el('span', {}, t)))));
  l.append(semana());
  if (r.incompletos) l.append(el('div', { cls:'aviso', style:'cursor:pointer', onclick: () => { sessionStorage.setItem('crm_lista', 'incompletos'); verBuscar(); } },
    r.incompletos + ' contactos en contacto no tienen forma de pago o temperatura, y sin eso no se pueden priorizar. Tocá para completarlos.'));

  // Cada bloque es un desplegable cerrado: título, cuántos hay y en rojo si hay algo urgente. Abierto, muestra de a PASO con "+N más".
  const sec = (k, titulo, ayuda, vacio, xs, pintar, pie) => {
    const paso = PASO[k], ver = paso ? (estado.ver[k] || paso) : Infinity;
    const cuerpo = el('div');
    const d = el('details', { cls:'blk' + (xs.length ? '' : ' vacio'), id:'sec-' + k, open: estado.abiertos[k] ? '' : undefined },
      el('summary', {}, el('div', { cls:'bloque' }, el('h3', { cls: xs.some(urgente) ? 'rojo' : '' }, titulo), xs.length ? el('span', { cls:'c' }, xs.length) : '', ayuda ? el('small', {}, ayuda) : '')),
      cuerpo);
    d.addEventListener('toggle', () => { estado.abiertos[k] = d.open; guardarEstado(); });
    if (!xs.length) cuerpo.append(el('div', { cls:'vacio' }, vacio));
    xs.slice(0, ver).forEach(x => cuerpo.append(pintar(x)));
    if (xs.length > ver) cuerpo.append(el('button', { cls:'btn sec ancho', style:'margin:2px 0 8px', onclick: () => {
      estado.ver[k] = ver + paso; guardarEstado(); pintarHoy(r, false);
    }}, '+' + Math.min(paso, xs.length - ver) + ' más (quedan ' + (xs.length - ver) + ')'));
    if (pie) cuerpo.append(pie);
    l.append(d);
  };
  const ETQ_V = { CAPTAR:'Captar', PRELISTING:'Prelisting', ACM:'ACM', 'NO CAPTADA':'No captada', 'CON OTRA INMO':'Con otra inmo', 'EN VENTA':'En venta' };
  const esComprador = x => !x.etapa && x.estado !== 'NUEVO';

  // 1. Con fecha fija: visitas a confirmar, cumpleaños (el día después) y fiestas
  const fijas = L('visitas').map(v => Object.assign({ _visita:true }, v, { resumen:'' })).concat(L('fechas'), L('fiestas'));
  sec('fijas', 'Con fecha fija', 'visitas, cumpleaños', 'Nada con fecha fija hoy.', fijas,
    x => x._visita ? tarjetaEnvio(x, x.texto, tx => api('api_accion', x.id, 'AVISO', x.clave, tx)) : filaEnvio(x),
    (r.fiestasPendientes || 0) > L('fiestas').length && L('fiestas').length ? el('div', { cls:'actual', style:'margin:0 2px 8px' }, 'Hasta 20 saludos por día. El resto aparece mañana.') : '');
  // 2. Lo que pusiste vos (hoy y atrasados): el texto, cuándo lo pusiste y el botón del medio que elegiste
  sec('proximos', 'Tus próximos pasos', 'hoy y atrasados', 'No pusiste nada para hoy.', L('proximos'), x => {
    const canal = String(x.canal || '');
    const boton = canal === 'Llamada' ? bLlamar(x) : canal === 'WhatsApp' ? bWhatsApp(x) : canal ? el('button', { cls:'btn sec', onclick: () => abrir(x.id, 'agenda') }, 'Agendar ' + canal.toLowerCase()) : bWhatsApp(x);
    const cuando = [x.definidoHace !== null && x.definidoHace !== undefined ? 'Lo pusiste ' + (x.definidoHace === 0 ? 'hoy' : 'hace ' + x.definidoHace + (x.definidoHace === 1 ? ' día' : ' días')) : '',
      canal ? 'por ' + canal : ''].filter(Boolean).join(' · ');
    return item(Object.assign({}, x, { porque: x.porque, jugada: '' }), '', {
      extra: el('div', { cls:'dato' }, cuando, x.atrasado > 0 ? el('span', { cls:'rojo' }, ' · atrasado ' + x.atrasado + (x.atrasado === 1 ? ' día' : ' días')) : ''),
      temp: esComprador(x), botones: [boton, bAbrir(x, 'Lo hice')] });
  });
  // 3. Calientes y tibios que ya sabés qué buscan y no les mandaste nada
  sec('opciones', 'Mandale opciones', 'calientes y tibios', 'Nadie esperando opciones.', L('opciones'), x => item(x, '', { temp:true, botones:[bAbrir(x, 'Elegir opciones', true)] }));
  // 4. Leads: las 3 llamadas (de a 5)
  sec('llamar', 'Llamar', 'leads nuevos', 'Nadie para llamar.', L('llamar'), x => item(x, '', { botones:[bLlamarLead(x), bNoContesto(x)] }));
  // 5. Mensajes de la cadencia (de a 5)
  sec('mensajes', 'Mensajes', 'cadencia', 'No hay mensajes para hoy.', L('mensajes'), x => filaEnvio(x));
  // 6. Lo que sugiere el CRM
  sec('atento', 'Estate atento', 'sugerencias', 'Nada más para hoy.', L('atento'), x => item(x, x.tipo === 'calificar' ? 'Por calificar' : ETQ_V[x.etapa] || '', {
    temp: esComprador(x), botones: x.deuda ? [bAbrir(x, 'Elegir opciones', true)] : [bLlamar(x), bWhatsApp(x)] }));
  sec('relacion', 'Relación', 'solo saludar', 'Nadie de relación para hoy.', L('relacion'), x => filaEnvio(x));
  // 7. Revivir (de a 3), del más viejo al más nuevo. El servidor ya corta en el tope de seguridad de WhatsApp.
  sec('revivir', 'Revivir', 'del más viejo al más nuevo', 'Nadie para revivir.', L('revivir'), x => filaEnvio(x));
  if (r.sinTel) l.append(el('div', { cls:'aviso' }, r.sinTel + ' contactos activos no tienen teléfono. Buscalos y completalos.'));
}

function verBuscar() {
  tabs('tBuscar');
  const l = document.getElementById('lista');
  const res = el('div');
  let t, ultimo = '', cartera = null;
  const lista = (titulo, xs) => res.replaceChildren(
    el('div', { cls:'fila', style:'align-items:center;justify-content:space-between;margin:14px 2px 6px' }, el('h2', { style:'margin:0' }, titulo + ' (' + xs.length + ')'),
      el('button', { cls:'chip chico', type:'button', onclick: volver }, '‹ Cartera')),
    ...(xs.length ? ordenar(xs).map(x => item(x)) : [el('div', { cls:'vacio' }, 'Nadie en esta lista.')]));
  const volver = () => { inp.value = ''; ultimo = ''; sessionStorage.removeItem('crm_lista'); segs.querySelectorAll('.chip').forEach(b => b.classList.remove('on')); pintarCartera(); };
  const buscar = async () => {
    const q = inp.value.trim();
    if (q.length < 2) { if (!q) volver(); return; }
    segs.querySelectorAll('.chip').forEach(b => b.classList.remove('on')); sessionStorage.removeItem('crm_lista');
    ultimo = q;
    const xs = await api('api_buscar', q);
    if (q !== ultimo) return;
    lista('Resultados', xs);
  };
  const inp = el('input', { type:'search', placeholder:'Buscar por nombre o teléfono', autocomplete:'off', enterkeyhint:'search',
    oninput: () => { clearTimeout(t); t = setTimeout(buscar, 350); },
    onkeydown: e => { if (e.key === 'Enter') { clearTimeout(t); buscar(); inp.blur(); } } });
  // Listas por segmento (la permuta cuenta como vendedor: tiene algo para vender)
  const SEGS = [['incompletos','Para completar'],['vendedores','Vendedores y permuta'],['cash','Búsquedas cash'],['credito','Búsquedas crédito'],['sinpago','Sin forma de pago']];
  const segs = el('div', { cls:'deslizable' }, ...SEGS.map(([k, tt]) => el('button', { cls:'chip seg chico', type:'button', onclick: async e => {

// Reduce una captura a JPEG de 1600px como maximo y devuelve el base64 (sin el prefijo data:)
function imagenJpeg(file) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error('no se pudo leer la imagen'));
    fr.onload = () => { const img = new Image(); img.onerror = () => mal(new Error('formato no soportado'));
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/jpeg', 0.82).split(',')[1]); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

    };
    return { cambios, nodo: el('div', { cls:'card' }, el('h3', {}, d['ETAPA VENTA'] === 'NO CAPTADA' ? 'Seguimiento: ¿publicó con otra inmobiliaria?' : 'Seguimiento: publicada con otra inmobiliaria'),
      el('div', { cls:'actual' }, d['PROX CONTACTO'] ? 'Próximo: ' + d['PROX CONTACTO'] + ' · ' + (d['PROX ACCION'] || '') : 'Sin próximo paso'),
      el('div', { cls:'actual', style:'margin:4px 0 8px' }, 'Buscar en portales y "Revisé" están en la solapa Contacto.'),
      f.nodo,
      el('label', {}, 'O publicada hace (días)'), hace,

      el('h3', { style:'margin-top:16px' }, 'Capturas (' + capturas.length + ')'),
      ...capturas.map((u, i) => el('div', {}, el('a', { href:u, target:'_blank', rel:'noopener' }, 'Captura ' + (i + 1)))),
      el('button', { cls:'btn ancho', style:'margin-top:8px', onclick: () => archivo.click() }, 'Subir captura'), archivo) };
  };

  // ── PERFIL
  const segPerfil = () => {
    const con = formulario(d, CAMPOS_CONTACTO, listas);
    const sobre = el('textarea', { style:'min-height:110px', placeholder:'Familia, hijos y edades, trabajo, qué lo motiva, qué le preocupa, cómo le gusta que le hablen...' }); sobre.value = d['SOBRE LA PERSONA'] || '';
    const motivo = select(MOTIVOS, MOTIVOS[0]);
    const estado = select(ESTADOS, d.ESTADO);
    pend = () => { const campos = con.cambios(); if (sobre.value !== (d['SOBRE LA PERSONA'] || '')) campos['SOBRE LA PERSONA'] = sobre.value;
      if (estado.value !== (d.ESTADO || '')) campos.ESTADO = estado.value; return { campos }; };
    return [
      el('div', { cls:'card' }, el('h3', {}, 'Sobre la persona'), sobre),
      el('div', { cls:'card' }, el('h3', {}, 'Estado'), estado,
        el('div', { cls:'actual', style:'margin-top:8px' }, 'Lo maneja el CRM solo. Cambialo a mano solo si quedó mal.')),
      el('div', { cls:'card' }, el('h3', {}, 'Datos de contacto'), con.nodo,
        el('button', { cls:'btn ancho', style:'margin-top:12px', icon:'contacto', onclick: async () => toast('Contactos de Google: ' + await api('api_contactoGoogle', id)) }, 'Pasar a Contactos'),
        el('div', { cls:'actual', style:'margin-top:8px' }, '"Pasar a Contactos" actualiza el nombre en tu agenda (y WhatsApp) con el formato "Nombre - Compra..." después de cambiar la búsqueda o la venta. Si solo cambiás el nombre, se pasa solo al guardar.')),
      el('div', { cls:'card' }, el('h3', {}, 'Archivar'),
        el('div', { cls:'grid2' }, motivo, el('button', { cls:'btn peligro', onclick: () => { if (confirm('¿Archivar a ' + d.NOMBRE + '?')) accion('DESCARTAR', motivo.value); } }, 'Archivar')),
        el('div', { cls:'actual', style:'margin-top:8px' }, '"No busca ahora": vuelve a aparecer en 45 días hábiles. Cualquier otro motivo: no vuelve.'))
    ];
  };

  const segHistorial = () => [el('div', { cls:'card' }, el('h3', {}, 'Historial'),
    r.hist.length ? r.hist.map(x => el('div', { cls:'hist' }, el('span', { cls:'cuando' }, x.fecha),
      el('b', {}, x.tipo), x.detalle ? ' · ' + x.detalle : '', x.texto ? '\n' + x.texto : '', editar(x))) : el('div', { cls:'vacio' }, 'Sin historial todavía.'))];

  const SEGMENTOS = [['contacto','Contacto',segContacto,0], ['perfil','Perfil',segPerfil,0], ['busqueda','Búsqueda',segBusqueda,mCompra.length],
    ['venta','Venta',segVenta,mVenta.length], ['agenda','Agenda',segAgenda,0], ['historial','Historial',segHistorial,0]];
  const cuerpo = el('div', { cls:'ficha-body' });
  const barra = el('div', { cls:'segmentos' });
  const mostrar = key => {
    if (key !== segmentoActual && fichaSucia() && !confirm('Tenés cambios sin guardar en esta solapa. ¿Salir igual?')) return;
    pend = null;
    segmentoActual = key; sessionStorage.setItem('crm_seg', key);
    barra.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
    cuerpo.replaceChildren(...SEGMENTOS.find(s => s[0] === key)[2]());
    if (pend) cuerpo.append(el('div', { cls:'guardar-fijo' }, el('button', { cls:'btn pri ancho', onclick: guardarTab }, 'Guardar')));
    p.scrollTop = 0;
  };
  SEGMENTOS.forEach(([k, t, , n]) => barra.append(el('button', { 'data-k':k, onclick: () => mostrar(k) }, t, n ? el('span', { cls:'n' }, n) : '')));

  p.replaceChildren(
    el('div', { cls:'ficha-head' },
      el('div', { cls:'barra' },
        el('button', { cls:'icono', 'aria-label':'Cerrar', icon:'cerrar', onclick: cerrar }),
        el('h1', {}, String(d.NOMBRE || '').split(' - ')[0]),
        el('img', { cls:'mono', src:'../assets/nl-mono-crema.svg', alt:'NL' })),
      r.etiqueta.includes(' - ') ? el('div', { cls:'etiqueta' }, el('span', {}, r.etiqueta.split(' - ').slice(1).join(' - '))) : '',
      el('div', { cls:'estado-linea' }, el('span', { cls:'pill' }, d.ESTADO || 'Sin estado'),
        d['ETAPA COMPRA'] ? el('span', { cls:'pill' }, 'Compra: ' + d['ETAPA COMPRA']) : '',
        d['ETAPA VENTA'] ? el('span', { cls:'pill' }, 'Venta: ' + d['ETAPA VENTA']) : ''),
      barra),
    cuerpo);
  mostrar(segmentoActual);
  if (!p.classList.contains('abierta')) { p.classList.add('abierta'); if (!esEscritorio()) document.body.style.overflow = 'hidden'; }
}

function refrescar() { if (cfg().key && document.getElementById('tHoy').classList.contains('on')) verHoy(); }

// Al recargar: vuelve a la ficha abierta (y su solapa). sessionStorage dura mientras la pestaña o la app esté abierta.
let desbloqueado = false;
const marcarActivo = () => { if (desbloqueado) sessionStorage.setItem('crm_activo', Date.now()); };
window.addEventListener('pagehide', marcarActivo);     // una recarga cuenta como actividad, no como salida
function arrancar() {
  desbloqueado = true; marcarActivo();
  verHoy();
  const id = sessionStorage.getItem('crm_vista');
  if (id) abrir(id, sessionStorage.getItem('crm_seg') || '').catch(() => sessionStorage.removeItem('crm_vista'));
}

document.getElementById('tHoy').onclick = verHoy;
document.getElementById('tBuscar').onclick = verBuscar;
document.getElementById('tNuevo').onclick = verNuevo;
document.getElementById('bMenu').onclick = () => { armarMenu(); menu(true); };
document.getElementById('bMenu').insertAdjacentHTML('afterbegin', ICON.burger);
document.getElementById('velo').onclick = () => menu(false);
document.querySelectorAll('[data-i]').forEach(s => s.insertAdjacentHTML('afterbegin', ICON[s.dataset.i]));
const hoyTxt = new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('fecha').textContent = hoyTxt.charAt(0).toUpperCase() + hoyTxt.slice(1);

if (!cfg().url || !cfg().key) pantallaConfig();
// Face ID solo si la app estuvo cerrada o en segundo plano más de BLOQUEO_MIN; una recarga no lo pide
else if (localStorage.getItem(LS.cred) && !(Date.now() - (+sessionStorage.getItem('crm_activo') || 0) < BLOQUEO_MIN * 60000)) pantallaBloqueo();
else arrancar();
</script>
</body>
