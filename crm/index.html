<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CRM Nahuel</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">   <!-- con esta, iOS informa el alto de la zona de la hora y .tope-ios la tapa -->
<meta name="apple-mobile-web-app-title" content="CRM">
<meta name="theme-color" content="#14231D">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Marca Nahuel Lim (BRAND.md), version app: todo en Inter */
  :root {
    --crema:#F7F4EC; --blanco:#FFFFFF; --verde-claro:#E3EEE9; --linea:#DDD6C6; --tinta:#14231D; --tinta-suave:#434C47;
    --verde:#006A4E; --verde-profundo:#005941; --dorado:#BEAF87; --dorado-oscuro:#5B4700;
    --alerta:#7A1F14; --alerta-fondo:#F6E3E0;
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* html oscuro: el iPhone toma ese color para la franja de arriba (sin esfumado claro) */
  html { background:var(--tinta); }
  html, body { overscroll-behavior-y:none; }   /* sin 'tirar para recargar' del navegador: para actualizar, tocá Hoy */
  body { min-height:100vh; }
  html, body { margin:0; color:var(--tinta); font:16px/1.45 Inter, -apple-system, system-ui, sans-serif; }
  input, select, textarea, button { font:inherit; font-size:16px; color:inherit; }   /* 16px: iOS no hace zoom */

  /* Fondo oscuro detrás de todo: iOS 26 (app de pantalla de inicio) toma de acá el color de la zona de la hora.
     El contenido sigue en crema: main pinta crema a los costados y hasta abajo. */
  body { background:var(--tinta); }
  main { background:var(--crema); box-shadow:0 0 0 100vmax var(--crema); clip-path:inset(0 -100vmax); min-height:calc(100vh - 60px); }
  .tope-ios { position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top, 0px); background:var(--tinta); z-index:60; pointer-events:none; }
  .top { position:relative; z-index:50; background:var(--tinta); color:var(--crema); padding:calc(var(--top) + 6px) 16px 6px; display:flex; align-items:center; gap:12px; }
  .top img { height:26px; display:block; }
  .calif { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 12px; }
  .calif small { display:block; font-size:12px; color:var(--tinta-suave); }
  .calif span { font-weight:600; }
  .calif .falta { color:#9b2c2c; font-weight:500; }
  .item.visita { flex-wrap:wrap; }
  .item.visita .cuerpo { flex:1 1 100%; cursor:pointer; }
  .item.visita .texto { font-size:14px; color:var(--tinta-suave); margin-top:6px; white-space:pre-wrap; }
  .item.visita .btn { flex:1 1 100%; margin-top:10px; }
  table.est { width:100%; border-collapse:collapse; font-size:14px; }
  table.est th, table.est td { text-align:left; padding:7px 4px; border-bottom:1px solid var(--linea); }
  table.est td.n, table.est th.n { text-align:right; white-space:nowrap; }
  .top .fecha { margin-left:auto; font-size:13px; color:var(--dorado); }
  .top .burger { background:none; border:0; color:var(--crema); width:44px; height:44px; display:flex; align-items:center; justify-content:center; margin-right:-8px; }
  .top .burger svg { width:26px; height:26px; }
  /* Menu lateral */
  #velo { position:fixed; inset:0; z-index:70; background:rgba(20,35,29,.45); display:none; }
  #velo.on { display:block; }
  #menu { position:fixed; top:0; right:0; bottom:0; z-index:71; width:min(320px, 86vw); background:var(--crema); transform:translateX(100%); transition:transform .2s ease; display:flex; flex-direction:column; padding:calc(var(--top) + 12px) 0 calc(var(--bottom) + 12px); }
  #menu.on { transform:none; }
  #menu .cab { display:flex; align-items:center; justify-content:space-between; padding:0 12px 12px 20px; border-bottom:1px solid var(--linea); }
  #menu .cab img { height:28px; }
  #menu .cab button { background:none; border:0; width:44px; height:44px; color:var(--tinta); }
  #menu .cab svg { width:24px; height:24px; }
  #menu .grupo { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-suave); padding:18px 20px 6px; }
  #menu a, #menu .op { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 20px; color:var(--tinta); text-decoration:none; font-weight:500; background:none; border:0; width:100%; text-align:left; cursor:pointer; }
  #menu a { flex-direction:column; align-items:flex-start; gap:2px; }
  #menu a small { color:var(--tinta-suave); font-weight:400; font-size:13px; }
  #menu a:active, #menu .op:active { background:var(--verde-claro); }
  #menu .abajo { margin-top:auto; border-top:1px solid var(--linea); }
  #menu .salir { color:var(--alerta); }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--tinta); display:flex; padding-bottom:var(--bottom); }
  nav.tabs button { flex:1; background:none; border:0; color:var(--crema); padding:12px 0 10px; font-size:13px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:3px; }
  nav.tabs button.on { color:var(--dorado); }
  nav.tabs svg { width:22px; height:22px; }

  main { padding:12px 16px calc(84px + var(--bottom)); max-width:720px; margin:0 auto; }
  .aviso { background:var(--alerta-fondo); color:var(--alerta); border-radius:12px; padding:12px 14px; margin:8px 0; font-size:14px; }

  .resumen { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:4px 0 8px; }
  .resumen div { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:10px 2px; text-align:center; min-width:0; }
  .resumen b { display:block; font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .resumen span { font-size:11px; color:var(--tinta-suave); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  h2 { font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-suave); margin:20px 4px 8px; }
  .item { background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .item .cuerpo { flex:1; min-width:0; }
  .item .nombre { font-weight:600; }
  .item .meta { font-size:14px; color:var(--tinta-suave); margin-top:2px; }
  .item .porque { font-size:14px; font-weight:600; margin-top:6px; }
  .item .jugada { font-size:14px; color:var(--verde-profundo); margin-top:2px; }
  .item .texto { font-size:14px; color:var(--tinta-suave); margin-top:6px; white-space:pre-wrap; }
  .item svg { width:18px; height:18px; color:var(--tinta-suave); flex:none; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .tags:empty { display:none; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; background:var(--verde-claro); color:var(--verde-profundo); }
  .pill.alerta { background:var(--alerta-fondo); color:var(--alerta); }
  .pill.oro { background:#F1ECDD; color:var(--dorado-oscuro); }
  .vacio { color:var(--tinta-suave); font-size:14px; padding:4px; }

  .btn { border:1px solid var(--linea); background:var(--blanco); border-radius:12px; padding:11px 14px; min-height:46px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, color .15s; }
  .btn:active { transform:scale(.98); }
  .btn.pri { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); }
  .btn.sec { background:var(--verde-claro); border-color:var(--verde-claro); color:var(--verde-profundo); }
  .btn.peligro { background:none; border-color:var(--alerta-fondo); color:var(--alerta); }
  .btn.marcado { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); font-weight:600; }
  .btn.marcado::before { content:'✓'; }
  .btn svg { width:20px; height:20px; }
  .btn.ancho { width:100%; }
  .chip { border:1px solid var(--linea); background:var(--blanco); border-radius:999px; padding:7px 12px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--verde-profundo); border-color:var(--verde-profundo); color:var(--crema); }
  .chip.on::after { content:' ×'; }
  .chip.seg.on::after { content:none; }
  .chip.chico { padding:4px 10px; font-size:13px; }
  .item .botones { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .item .botones .btn { padding:10px 12px; font-size:14px; flex:1 1 40%; justify-content:center; }
  .rojo { color:var(--alerta); font-weight:600; }
  .sobre { font-size:14px; background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:8px 12px; margin-bottom:10px; white-space:pre-wrap;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .sobre.abierto { display:block; }
  .sugerencia { background:var(--verde-claro); border-radius:12px; padding:10px 12px; margin:12px 0; font-size:14px; }
  /* v29: tarjeta con jerarquía. Rojo = urgente, verde = se toca, gris = dato */
  /* v41: banda a la izquierda = temperatura (rojo caliente, amarillo tibio, azul frío, gris sin dato). Lo urgente va en rojo en el texto. */
  .t { background:var(--blanco); border:1px solid var(--linea); border-radius:14px; padding:12px 14px 11px 18px; margin-bottom:8px; cursor:pointer; position:relative; overflow:hidden; }
  .t::before { content:''; position:absolute; left:6px; top:10px; bottom:10px; width:5px; border-radius:4px; background:var(--banda, #C9C2B2); }
  .t.CALIENTE { --banda:#C0392B; } .t.TIBIO { --banda:#C9A227; } .t.FRIO { --banda:#4A7FA7; } .t.VEND { --banda:var(--verde-profundo); }   /* vendedor: color propio */
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:4px 0 8px; }
  .grid4 .chip { border-radius:10px; text-align:center; padding:6px 2px; font-size:13px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grid4 .chip.rojo { color:var(--alerta); } .grid4 .chip.rojo.on { background:var(--alerta); color:var(--crema); border-color:var(--alerta); }
  .grid4 .chip em { display:block; font-style:normal; font-weight:700; font-size:15px; margin:1px 0 0; }   /* el número abajo: todos del mismo tamaño */
  details.grp { margin-bottom:6px; } details.grp > summary { list-style:none; cursor:pointer; background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:10px 12px; }
  /* Búsquedas: lista compacta (filas separadas por líneas, sin color): para comparar a varios de un vistazo */
  .lb { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; overflow:hidden; margin-bottom:8px; }
  .lb .r { padding:10px 12px; border-top:1px solid var(--linea); cursor:pointer; }
  .lb .r:first-child { border-top:0; }
  .lb .sub { padding:6px 12px; background:var(--crema); border-top:1px solid var(--linea); font-size:13px; font-weight:700; color:var(--tinta-suave); }
  .lb .sub:first-child { border-top:0; }
  .lb .l1 { display:flex; align-items:baseline; gap:8px; }
  .lb .n { font-weight:700; } .lb .v { margin-left:auto; font-size:13px; font-weight:600; color:var(--verde-profundo); white-space:nowrap; } .lb .v.rojo { color:var(--alerta); }
  .lb .tope { font-size:15px; font-weight:600; margin-top:1px; }
  .lb .c2 { font-size:13px; color:var(--tinta-suave); margin-top:1px; }
  .lb .req { font-size:13px; margin-top:1px; } .lb .req b { color:var(--tinta-suave); font-weight:600; }
  details.grp > summary::-webkit-details-marker { display:none; } details.grp[open] > summary { margin-bottom:6px; }
  details.grp .gt { font-weight:700; } details.grp .gc { font-size:12px; font-weight:700; color:var(--crema); background:var(--tinta); border-radius:999px; padding:1px 7px; margin-left:6px; } details.grp .gs { display:block; font-size:13px; color:var(--tinta-suave); margin-top:2px; }
  .t.urge .porque { color:var(--alerta); }
  .t .req { font-size:14px; color:var(--tinta); margin-top:2px; } .t .req b { font-weight:600; color:var(--tinta-suave); }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0 8px; }
  .grid3 .chip { border-radius:10px; text-align:center; padding:8px 4px; }
  .grid3.g4 { grid-template-columns:repeat(5,1fr); }
  .grid3 .chip em { font-style:normal; opacity:.7; margin-left:3px; }
  .orden { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--tinta-suave); margin:2px 2px 10px; }
  .orden select { width:auto; padding:6px 30px 6px 10px; font-weight:600; }
  .orden .btn { margin-left:auto; min-height:36px; padding:6px 10px; font-size:13px; }
  .t .vuelve { margin-left:auto; font-size:13px; font-weight:600; color:var(--verde-profundo); white-space:nowrap; }
  .t .vuelve.rojo { color:var(--alerta); }
  .t .por { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; font-size:12px; }
  .t .por span { background:var(--verde-claro); color:var(--verde-profundo); border-radius:6px; padding:1px 7px; }
  .t .por span.ojo { background:#F5EDD3; color:#7A5F0B; } .t .por span.ya { background:var(--crema); color:var(--tinta-suave); }
  .sep-hoy { display:flex; align-items:center; gap:10px; margin:22px 2px 0; color:var(--tinta-suave); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .sep-hoy::before, .sep-hoy::after { content:''; flex:1; border-top:1px solid var(--linea); }
  .t .f1 { display:flex; align-items:baseline; gap:8px; }
  .t .nom { font-size:17px; font-weight:700; letter-spacing:-.01em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t .dias { margin-left:auto; font-size:13px; color:var(--tinta-suave); white-space:nowrap; }
  .t .dias.rojo { color:var(--alerta); font-weight:700; }
  .t .busca { font-size:14px; color:var(--tinta-suave); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .t .dato { font-size:13px; color:var(--tinta-suave); margin-top:2px; }
  .t .porque { font-size:15px; font-weight:600; margin-top:10px; }
  .t .sug { font-size:14px; color:var(--verde-profundo); margin-top:2px; }
  .t .nota1 { font-size:13px; color:var(--tinta-suave); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-style:italic; }
  .t .acc { display:flex; gap:8px; margin-top:12px; }
  .t .acc .btn { flex:1; min-height:48px; font-weight:600; font-size:15px; }
  .btn.ico, .t .acc .btn.ico, .fila > .btn.ico { flex:0 0 52px; padding:0; }
  /* Buscador general */
  .busca-g { position:sticky; top:0; z-index:45; background:var(--tinta); padding:0 12px 10px; }
  .busca-g > input, .busca-g > #resBusca { max-width:720px; margin:0 auto; }
  .busca-g input { width:100%; display:block; border:0; border-radius:12px; padding:10px 14px; font-size:16px; background:var(--crema); }
  #resBusca { display:none; position:absolute; left:0; right:0; margin:0 auto; top:100%; max-height:75vh; overflow:auto; background:var(--crema); box-shadow:0 12px 30px rgba(20,35,29,.25); padding:6px 12px 14px; }
  #resBusca.on { display:block; }
  #resBusca h4 { margin:12px 2px 6px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-suave); }
  #resBusca .rb { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:9px 12px; margin-bottom:6px; cursor:pointer; font-size:14px; }
  #resBusca .rb b { display:block; font-size:15px; } #resBusca .rb small { color:var(--tinta-suave); display:block; }
  #resBusca .rb .lk { display:flex; gap:14px; margin-top:4px; } #resBusca .rb .lk a { color:var(--verde-profundo); font-weight:600; }
  .linea-po { margin:2px 4px 8px; cursor:pointer; color:var(--verde-profundo); }
  /* Para ordenar (arriba de Cartera) */
  .po { background:var(--blanco); border:2px solid var(--dorado); border-radius:16px; padding:10px 12px; margin:4px 0 12px; }
  .po .hd { display:flex; align-items:center; gap:8px; padding-bottom:10px; margin-bottom:2px; border-bottom:1px solid var(--linea); }
  .po .hd + datalist + .it { border-top:0; } .po .hd h3 { margin:0; font-size:17px; } .po .hd .btn { margin-left:auto; min-height:34px; padding:5px 12px; font-size:13px; }
  .po .it { border-top:1px solid var(--linea); padding:10px 0; } .po .it:first-of-type { border-top:0; }
  .po .tx { font-size:14px; color:var(--tinta-suave); font-style:italic; white-space:pre-wrap; } .po .tx small { font-style:normal; margin-left:6px; }
  .po .dest { font-size:14px; margin-top:4px; } .po .dest b { color:var(--verde-profundo); } .po .dest.duda b { color:var(--alerta); }
  .po .bt { display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; } .po .bt .btn { min-height:36px; padding:6px 12px; font-size:13px; }
  .po .ed { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; } .po .ed .ancho2 { grid-column:1 / -1; } .po .ed label { font-size:12px; color:var(--tinta-suave); margin:0; }
  /* Cartera tipo planilla */
  .pl { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; overflow:hidden; margin-bottom:10px; }
  .pl .gh { background:var(--crema); padding:8px 10px; font-weight:700; color:var(--tinta-suave); font-size:12px; letter-spacing:.05em; text-transform:uppercase; display:flex; border-top:1px solid var(--linea); }
  .pl .gh:first-child { border-top:0; } .pl .gh span { margin-left:auto; }
  .pl .fr { display:grid; grid-template-columns:1.15fr 1.25fr 1fr; gap:8px; padding:9px 10px; border-top:1px solid var(--linea); cursor:pointer; font-size:13px; align-items:start; }
  .pl .fr b { display:block; font-size:14.5px; } .pl .fr small { display:block; color:var(--tinta-suave); font-size:12px; line-height:1.3; }
  .pl .fr .px { font-weight:700; font-size:13.5px; } .pl .fr .px.rojo { color:var(--alerta); } .pl .fr .px.hoy { color:var(--verde-profundo); }
  .pl .cab { display:grid; grid-template-columns:1.15fr 1.25fr 1fr; gap:8px; padding:5px 10px; font-size:10.5px; font-weight:700; color:var(--tinta-suave); text-transform:uppercase; letter-spacing:.05em; border-top:1px solid var(--linea); }
  .fila3 { display:grid; grid-template-columns:1fr 1fr 56px; gap:8px; margin:0 0 12px; } .fila3 .btn { min-width:0; padding:10px 6px; }
  details.grp { background:var(--blanco); border:1px solid var(--linea); border-radius:12px; overflow:hidden; }
  details.grp > summary { border:0 !important; border-radius:0 !important; }
  details.grp[open] > summary { border-bottom:1px solid var(--linea) !important; margin-bottom:0 !important; }
  details.grp .lb { border:0; border-radius:0; margin:0; }
  .lb .sub { background:var(--verde-claro) !important; color:var(--verde-profundo) !important; }
  .lb .tipo { background:var(--crema); }
  .segmentos button.sucia::after { content:' •'; color:var(--dorado); }
  .guardar-fijo .txt { font-size:13px; color:var(--tinta-suave); margin-right:auto; }
  .modal-fondo { position:fixed; inset:0; z-index:90; background:rgba(20,35,29,.5); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal { background:var(--blanco); border-radius:16px; padding:18px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:8px; }
  .modal h3 { margin:0; font-size:18px; } .modal p { margin:0 0 6px; color:var(--tinta-suave); font-size:14px; }
  .lb .tipo { padding:8px 12px 4px; font-size:14px; font-weight:700; color:var(--verde-profundo); border-top:1px solid var(--linea); }
  .lb .tipo:first-child { border-top:0; }

function el(tag, attrs, ...hijos) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === undefined || v === null || v === false) return;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'cls') e.className = v; else if (k === 'icon') e.insertAdjacentHTML('afterbegin', ICON[v]); else e.setAttribute(k, v);
  });

  return e;
}

function anotarTiempo(fn, ms) {
  try { const xs = JSON.parse(localStorage.getItem('crm_tiempos') || '[]'); xs.push([fn, ms]); localStorage.setItem('crm_tiempos', JSON.stringify(xs.slice(-60))); } catch (e) {}

async function api(fn, ...args) {
  const { url, key } = cfg(), t0 = Date.now();
  pendientes++; document.getElementById('cargando').style.display = 'block';
  try {
    // "Load failed": el iPhone corta la conexión cuando la app pasa a segundo plano (WhatsApp, llamada).
    // Lo que solo lee se reintenta solo. Lo que guarda NO, para no registrar dos veces el mismo mensaje.
    const soloLee = SOLO_LEE.includes(fn);
    let res;
    for (let i = 0; ; i++) {
      try { res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args, k: key }) }); break; }
      catch (e) {
        if (!soloLee || i >= 2) { e.red = true; throw e; }
        await new Promise(ok => setTimeout(ok, 1500));
      }
    }
    const j = await res.json();
    anotarTiempo(fn, Date.now() - t0);
    if (!j.ok) {
      if (j.error === 'no autorizado') { pantallaConfig('La clave no es válida. Volvé a cargarla.'); }
      throw new Error(j.error);
    }
    return j.data;
  } catch (e) {
    if (e.red) { if (document.visibilityState === 'visible') toast(SOLO_LEE.includes(fn) ? 'Sin conexión. Probá de nuevo en un momento.' : 'Sin conexión: puede que no se haya guardado. Revisalo en el Historial.'); }
    else toast('Error: ' + e.message + ' (tocá para cerrar)', true);
    throw e;
  } finally {
    if (--pendientes <= 0) { pendientes = 0; document.getElementById('cargando').style.display = 'none'; }
  }
}

// Seleccion multiple con chips. buscador: true muestra un campo para filtrar (para listas largas como barrios).
function multi(opciones, valorStr, buscador) {
  const elegidos = String(valorStr || '').split(',').map(x => x.trim()).filter(Boolean);
  const todas = [...new Set([...opciones, ...elegidos])];
  const nodo = el('div', { cls:'multi' }), arriba = el('div', { cls:'elegidos' }), abajo = el('div', { cls:'opciones' });
  const filtro = buscador ? el('input', { type:'search', placeholder:'Buscar barrio', autocomplete:'off' }) : null;
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pintar = () => {
    arriba.replaceChildren(...elegidos.map(o => el('button', { cls:'chip on', type:'button', onclick: () => { elegidos.splice(elegidos.indexOf(o), 1); pintar(); } }, o)));
    const q = filtro ? norm(filtro.value.trim()) : '';
    const libres = todas.filter(o => !elegidos.includes(o) && (!buscador || (q && norm(o).includes(q))));
    // pointerdown sin default: el campo de búsqueda no pierde el foco (en el iPhone no se cierra el teclado)
    abajo.replaceChildren(...libres.slice(0, 15).map(o => el('button', { cls:'chip', type:'button', onpointerdown: e => { if (filtro) e.preventDefault(); },
      onclick: () => elegir(o) }, o)));
    primero = libres[0];
    if (buscador && !q) abajo.replaceChildren(el('span', { cls:'vacio' }, elegidos.length ? '' : 'Escribí para buscar barrios.'));
  };
  let primero = null;
  const elegir = o => { elegidos.push(o); if (filtro) { filtro.value = ''; filtro.focus(); } pintar(); };
  if (filtro) {
    filtro.addEventListener('input', pintar);
    filtro.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (filtro.value.trim() && primero) elegir(primero); } });   // Enter elige el primero
  }
  nodo.append(arriba, filtro || '', abajo); pintar();

}

// Formulario de campos del Sheet con el control adecuado a cada campo; devuelve { nodo, cambios() }
function formulario(d, campos, listas, anchos) {
  const ctrl = {};
  let ambMax;
  const control = k => {
    const v = d[k] || '';
    const sel = ops => { const s = select(ops, v); return { nodo:s, valor:() => s.value }; };
    if (k === 'BUSCA TIPO' || k === 'VENDE TIPO') { const m = multi(TIPOS, v); return { nodo:m, valor:m.valor }; }
    if (k === 'BUSCA BARRIOS') { const m = multi(listas.barrios || [], v, true); return { nodo:m, valor:m.valor, ancho:true }; }
    if (k === 'VENDE BARRIO') return sel(['', ...(listas.barrios || [])]);
    if (/AMB/.test(k)) {                                                   // en el iPhone se ve como rueda
      const s = select(AMBS, v === '5' ? '5+' : v, AMBS_TXT);
      if (k === 'BUSCA AMB MAX') ambMax = s;
      if (k === 'BUSCA AMB MIN') s.addEventListener('change', () => {
        const sug = AMB_MAX_SUGERIDO[s.value];
        if (ambMax && sug && (!ambMax.value || parseInt(ambMax.value) < parseInt(s.value))) ambMax.value = sug;
      });
      return { nodo:s, valor:() => s.value };
    }
    if (k === 'URGENCIA') return sel(['', ...(listas.urgencias || [])]);
    if (k === 'MOTIVACION') return sel(['', ...(listas.motivaciones || [])]);
    if (k === 'BUSCA FORMA DE PAGO') return sel(['','PARTE DE PAGO','VENTA','CASH','CREDITO APROBADO','CREDITO EN TRAMITE','CREDITO SIN CONFIRMAR']);
    if (k === 'BUSCA COCHERA') return sel(['','SI','NO','DESEABLE']);
    if (k === 'FUENTE') return sel(['', ...FUENTES]);
    if (k === 'ROL') { const s = select(['','COMPRADOR','VENDEDOR','AMBOS'], v, ['—','Compra','Vende','Vende y compra']); return { nodo:s, valor:() => s.value }; }
    if (k === 'TEMPERATURA') return sel(['','CALIENTE','TIBIO','FRIO']);
    if (k === 'RELACION') { const s = select(['','A','B','C'], v, ['No','A · cada 30 días','B · cada 60 días','C · cada 90 días']); return { nodo:s, valor:() => s.value }; }
    if (k === 'CUMPLEANOS' || /FECHA|DESDE|AUTORIZACION/.test(k)) { const i = el('input', { type:'date', value: aISO(v) }); return { nodo:i, valor:() => i.value, orig: aISO(v) }; }
    if (/USD/.test(k)) { const i = el('input', { inputmode:'numeric', value:v }); return { nodo:i, valor:() => i.value.replace(/\D/g, '') }; }
    if (k === 'OTRA INMO LINK') { const i = el('input', { type:'url', value:v, placeholder:'https://www.zonaprop.com.ar/...' }); return { nodo:i, valor:() => i.value.trim(), ancho:true }; }
    if (k === 'NOTAS' || k === 'BUSCA REQUISITOS') { const t = el('textarea', { style:'min-height:64px' }); t.value = v; return { nodo:t, valor:() => t.value, ancho:true }; }
    const i = el('input', { value:v }); return { nodo:i, valor:() => i.value };
  };
  const nodo = el('div', { cls:'grid2' }, ...campos.map(k => {
    const c = control(k); ctrl[k] = c;
    return el('div', { cls: c.ancho || (anchos || []).includes(k) ? 'ancho2' : '' }, el('label', {}, ETIQ(k)), PREGUNTAS[k] && CAMPOS_CALIF.includes(k) ? el('div', { cls:'pregunta' }, PREGUNTAS[k]) : '', c.nodo);
  }));
  return { nodo, cambios: () => { const r = {}; Object.entries(ctrl).forEach(([k, c]) => { const orig = c.orig !== undefined ? c.orig : String(d[k] || ''); if (c.valor() !== orig) r[k] = c.valor(); }); return r; } };
}

// Subgrupos por presupuesto: ordenados de mayor a menor, un tope sigue en el mismo subgrupo si está a 30k o menos del anterior.
const SALTO_PRECIO = 30000;
function porPrecio(xs) {
  const k$ = n => Math.round(n / 1000) + 'k', out = [], sin = xs.filter(x => !x.usd);
  xs.filter(x => x.usd).forEach(x => {
    const g = out[out.length - 1];
    if (g && g.min - x.usd <= SALTO_PRECIO) { g.xs.push(x); g.min = x.usd; } else out.push({ max: x.usd, min: x.usd, xs: [x] });
  });
  out.forEach(g => { g.titulo = g.max === g.min ? k$(g.max) : k$(g.min) + ' a ' + k$(g.max); });
  if (sin.length) out.push({ titulo: 'Sin presupuesto', xs: sin });
  return out;
}
// Fila de Búsquedas: nombre y cuándo vuelve; el tope y los ambientes bien visibles; qué compra; requisitos; cuándo hablaron.
function filaBusqueda(x, hoyIds) {
  const vuelve = hoyIds.has(String(x.id)) ? 'Hoy' : String(x.vuelve || '').split(' · ')[0];
  const vf = aISO(x.vuelveFecha || ''), atras = vuelve === 'Hoy' || (vf && vf < isoLocal(new Date()));
  const amb = x.ambMin ? (x.ambMax && x.ambMax !== x.ambMin ? x.ambMin + ' a ' + (x.ambMax >= 5 ? '5+' : x.ambMax) : x.ambMin) + ' amb' : '';
  const dias = x.diasSin === null || x.diasSin === undefined ? 'sin contactos' : x.diasSin === 0 ? 'hablaron hoy' : x.diasSin === 1 ? 'hablaron ayer' : 'hablaron hace ' + x.diasSin + ' días';
  return el('div', { cls:'r', onclick: () => abrir(x.id, 'contacto') },
    el('div', { cls:'l1' }, el('span', { cls:'n' }, String(x.nombre).split(' - ')[0]), vuelve ? el('span', { cls:'v' + (atras ? ' rojo' : '') }, vuelve) : ''),
    el('div', { cls:'tope' }, [x.usd ? 'Hasta ' + Math.round(x.usd / 1000) + 'k' : 'Sin presupuesto', amb, x.cash ? 'Cash' : ''].filter(Boolean).join(' · ')),
    x.resumen ? el('div', { cls:'c2' }, x.resumen) : '',
    x.requisitos ? el('div', { cls:'req' }, el('b', {}, 'Requisitos: '), x.requisitos) : '',

// Búsquedas: la demanda que ya tenés cargada, por barrio → tipo → rango de precio ("Caballito · 6 — Depto 4 · PH 2").
// Sirve para buscar una vez para varios y para leer el grupo de colegas sabiendo a quién le sirve cada cosa.
// Alguien que busca en dos barrios aparece en los dos. Barrios con más gente primero; adentro, cada tipo de mayor a menor presupuesto.
function verBusquedas(datos) {
  const l = document.getElementById('lista'), hoyIds = enHoyIds();
  const barrios = {};
  datos.personas.forEach(x => (x.busq || []).forEach(b => {
    const [tk, bk] = b.k.split('|');
    const g = barrios[bk] = barrios[bk] || { b: b.b, ids: new Set(), tipos: {} };
    g.ids.add(String(x.id));
    (g.tipos[tk] = g.tipos[tk] || { t: b.t, xs: [] }).xs.push(x);
  }));
  const lista = Object.values(barrios).sort((a, b) => b.ids.size - a.ids.size || a.b.localeCompare(b.b));
  const total = new Set(lista.flatMap(g => [...g.ids])).size;
  l.replaceChildren(
    el('div', { cls:'fila', style:'align-items:center;justify-content:space-between;margin:6px 2px' }, el('h2', { style:'margin:0' }, 'Búsquedas (' + total + ')'),
      el('button', { cls:'chip chico', type:'button', onclick: verBuscar }, '‹ Cartera')),
    el('div', { cls:'actual', style:'margin:0 2px 8px' }, 'Tu demanda por barrio, tipo y precio. Tocá un barrio para ver quiénes son.'),
    ...(lista.length ? lista.map(g => {
      const tipos = Object.values(g.tipos).sort((a, b) => b.xs.length - a.xs.length);
      return el('details', { cls:'grp' }, el('summary', {}, el('span', { cls:'gt' }, g.b), el('span', { cls:'gc' }, g.ids.size),
          el('span', { cls:'gs' }, tipos.map(t => t.t + ' ' + t.xs.length).join(' · '))),
        el('div', { cls:'lb' }, ...tipos.flatMap(t => [el('div', { cls:'tipo' }, t.t),
          ...porPrecio(t.xs.slice().sort((a, b) => (b.usd || 0) - (a.usd || 0))).flatMap(sg => [el('div', { cls:'sub' }, sg.titulo + ' · ' + sg.xs.length), ...sg.xs.map(x => filaBusqueda(x, hoyIds))])])));
    }) : [el('div', { cls:'vacio' }, 'Nadie tiene la búsqueda cargada con tipo y barrio.')]));
}

// Reduce una captura a JPEG de 1600px como maximo y devuelve el base64 (sin el prefijo data:)
function imagenJpeg(file) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error('no se pudo leer la imagen'));
    fr.onload = () => { const img = new Image(); img.onerror = () => mal(new Error('formato no soportado'));
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/jpeg', 0.82).split(',')[1]); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

      el('button', { cls:'chip', type:'button', style:'margin-top:8px', onclick: otra }, '+ otra'),
      el('button', { cls:'btn pri ancho', style:'margin-top:12px', onclick: async () => {
        const sueltasV = [...sueltas.children].map(f => f.valor()).filter(x => x.direccion || x.link);
        if (sueltasV.some(x => !x.direccion)) return toast('Cargá la dirección de cada opción suelta: el link puede dejar de existir', true);
        const items = [...marcados].map(m => ({ direccion: m.direccion || m.texto, link: m.link || '' })).concat(sueltasV);
        if (!items.length) return toast('Marcá o cargá al menos una opción', true);
        await api('api_opciones', id, items); toast('Registrado: le mandaste ' + items.length + (items.length === 1 ? ' opción' : ' opciones')); reabrir(); refrescar();
      }}, 'Le mandé estas opciones'),
      el('label', { style:'margin-top:14px' }, '¿No le gustó lo que le mandaste?'),
      el('div', { cls:'grid2' }, motivo, el('button', { cls:'btn', onclick: () => accion('NO_GUSTO', motivo.value) }, 'No le gustó')));
  };
  // Lo que ya le mandaste: las fichas del generador y lo registrado con "Le mandé opciones"
  const tarjetaEnviadas = () => {
    const regs = r.hist.filter(x => x.tipo === 'OPCIONES' || x.tipo === 'NO_GUSTO');
    if (!mEnviadas.length && !regs.length) return '';
    return el('div', { cls:'card' }, el('h3', {}, 'Ya le mandaste'),
      ...regs.map(x => el('div', { cls:'match gris' }, el('div', { style:'flex:1;white-space:pre-wrap' },
        x.fecha + ' · ' + (x.tipo === 'NO_GUSTO' ? 'No le gustó: ' + x.detalle : x.detalle + (x.detalle === '1' ? ' opción' : ' opciones') + '\n' + x.texto)))),
      ...mEnviadas.map(filaMatch));
  };

  // ── VENTA
  const segVenta = () => {
    const etapa = select(ETAPA_VENTA, d['ETAPA VENTA'] === 'CAPTADA' ? 'EN VENTA' : d['ETAPA VENTA'], ETAPA_VENTA_TXT);
    const f = formulario(d, CAMPOS_VENTA, listas, ['VENDE BARRIO','VENDE DIRECCION','VENDE PRECIO USD','VENDE PUBLICACION']);
    // La tarjeta de seguimiento (inmobiliaria, link, desde cuándo, captura) aparece apenas elegís la etapa, sin guardar antes
    const seg = tarjetaSeguimiento();
    const verSeg = () => { seg.nodo.style.display = VENTA_SEGUIMIENTO.includes(etapa.value) ? '' : 'none'; };
    etapa.addEventListener('change', verSeg); verSeg();
    pend = () => {
      const campos = Object.assign(f.cambios(), VENTA_SEGUIMIENTO.includes(etapa.value) ? seg.cambios() : {});
      if (etapa.value !== (d['ETAPA VENTA'] || '') && !campos['ETAPA VENTA']) campos['ETAPA VENTA'] = etapa.value;
      return { campos };
    };
    return [
      el('div', { cls:'card' }, el('h3', {}, 'Etapa de venta'), etapa),
      el('div', { cls:'card' }, el('h3', {}, 'Qué vende'), f.nodo),
      seg.nodo,
      el('div', { cls:'card' }, el('h3', {}, 'Compradores que matchean (' + mVenta.length + ')'), mVenta.length ? mVenta.map(filaMatch) : el('div', { cls:'vacio' }, 'Sin compradores que matcheen.')),
      (r.acms || []).length ? el('div', { cls:'card' }, el('h3', {}, 'ACM'), ...r.acms.map(a => el('div', { cls:'match' }, el('div', { style:'flex:1' }, a.fecha + ' · ' + a.direccion), a.link ? el('a', { href:a.link, target:'_blank', rel:'noopener' }, 'Ver ACM') : ''))) : '',
      ['CAPTAR','PRELISTING','ACM','NO CAPTADA','CON OTRA INMO'].includes(d['ETAPA VENTA']) ? el('div', { cls:'card' }, el('h3', {}, 'Placa'),
        r.placa ? [el('div', { cls:'actual', style:'margin-bottom:8px' }, 'Abrila, descargala y mandásela por WhatsApp.'), el('a', { cls:'btn ancho', href:r.placa, target:'_blank', rel:'noopener' }, 'Ver la placa')]
                : el('div', { cls:'vacio' }, 'No hay placa para su barrio, tipo y ambientes. Si la armás, cargala en la pestaña PLACAS del Sheet.')) : ''
    ];
  };
  // Vendedor no captado: revisar si publico con otra inmobiliaria, guardar la prueba y recaptar
  const tarjetaSeguimiento = () => {
    const f = formulario(d, CAMPOS_SEG_VENDEDOR, listas);
    const hace = el('input', { inputmode:'numeric', placeholder:'Ej.: 40' });
    const dir = [d['VENDE DIRECCION'], d['VENDE BARRIO']].filter(Boolean).join(', ');
    const q = '"' + (d['VENDE DIRECCION'] || '') + '" (site:zonaprop.com.ar OR site:argenprop.com OR site:mercadolibre.com.ar)';
    const archivo = el('input', { type:'file', accept:'image/*', style:'display:none', onchange: async e => {
      const file = e.target.files[0]; if (!file) return;
      toast('Subiendo captura...');
      try { await api('api_captura', id, await imagenJpeg(file), file.name); toast('Captura guardada en Drive'); reabrir(); }
      catch (err) { toast('No se pudo subir: ' + err.message, true); }
    }});
    const capturas = String(d.CAPTURAS || '').split('\n').filter(Boolean);
    const cambios = () => {
      const c = f.cambios();
      if (hace.value) { const x = new Date(); x.setDate(x.getDate() - parseInt(hace.value)); c['OTRA INMO DESDE'] = isoLocal(x); }
      if ((c['OTRA INMO LINK'] || c['OTRA INMO'] || c['OTRA INMO DESDE']) && d['ETAPA VENTA'] === 'NO CAPTADA') c['ETAPA VENTA'] = 'CON OTRA INMO';
      return c;
    };
    return { cambios, nodo: el('div', { cls:'card' }, el('h3', {}, d['ETAPA VENTA'] === 'NO CAPTADA' ? 'Seguimiento: ¿publicó con otra inmobiliaria?' : 'Seguimiento: publicada con otra inmobiliaria'),
      el('div', { cls:'actual' }, d['PROX CONTACTO'] ? 'Próximo: ' + d['PROX CONTACTO'] + ' · ' + (d['PROX ACCION'] || '') : 'Sin próximo paso'),
      el('div', { cls:'actual', style:'margin:4px 0 8px' }, 'Buscar en portales y "Revisé" están en la solapa Contacto.'),
      f.nodo,
      el('label', {}, 'O publicada hace (días)'), hace,

      el('h3', { style:'margin-top:16px' }, 'Capturas (' + capturas.length + ')'),
      ...capturas.map((u, i) => el('div', {}, el('a', { href:u, target:'_blank', rel:'noopener' }, 'Captura ' + (i + 1)))),
      el('button', { cls:'btn ancho', style:'margin-top:8px', onclick: () => archivo.click() }, 'Subir captura'), archivo) };
  };

  // ── PERFIL
  const segPerfil = () => {
    const con = formulario(d, CAMPOS_CONTACTO, listas);
    const sobre = el('textarea', { style:'min-height:110px', placeholder:'Familia, hijos y edades, trabajo, qué lo motiva, qué le preocupa, cómo le gusta que le hablen...' }); sobre.value = d['SOBRE LA PERSONA'] || '';
    const estado = select(ESTADOS, d.ESTADO);
    pend = () => { const campos = con.cambios(); if (sobre.value !== (d['SOBRE LA PERSONA'] || '')) campos['SOBRE LA PERSONA'] = sobre.value;
      if (estado.value !== (d.ESTADO || '')) campos.ESTADO = estado.value; return { campos }; };
    return [
      el('div', { cls:'card' }, el('h3', {}, 'Notas'), sobre),
      el('div', { cls:'card' }, el('h3', {}, 'Estado'), estado,
        el('div', { cls:'actual', style:'margin-top:8px' }, 'Lo maneja el CRM solo. Cambialo a mano solo si quedó mal.')),
      el('div', { cls:'card' }, el('h3', {}, 'Datos de contacto'), con.nodo,
        el('div', { cls:'actual', style:'margin-top:10px' }, 'El nombre en tu agenda (y en WhatsApp) se actualiza solo al guardar el nombre, la búsqueda o la venta. ',
          el('a', { href:'#', style:'color:var(--verde-profundo);font-weight:600', onclick: async e => { e.preventDefault(); toast('Contactos de Google: ' + await api('api_contactoGoogle', id)); } }, 'Forzar ahora'))),
      el('div', { cls:'actual', style:'margin:0 2px' }, 'Archivar está en la solapa Contacto, abajo de todo.')
    ];
  };

  // Historial en palabras (en el Sheet queda el código: CONTACTO, PROXIMO, LLAMADA_NO...)
  const TIPO_TXT = { CONTACTO:'Qué pasó', PROXIMO:'Próximo paso', LLAMADA_NO:'No contestó', LLAMADA_SI:'Contestó la llamada', RESPONDIO:'Contestó', MENSAJE:'Mensaje',
    OPCIONES:'Le mandaste opciones', NO_GUSTO:'No le gustó', REVISION:'Revisaste si publicó', NOTA:'Nota', ALTA:'Alta', DESCARTAR:'Archivado', AVISO:'Confirmación enviada', EVENTO:'Evento', 'EVENTO CORREGIDO':'Evento corregido' };
  const detalleTxt = x => {
    if (x.tipo !== 'PROXIMO') return x.detalle;
    const [f, canal] = String(x.detalle || '').split('|');
    if (!f) return 'lo decide el CRM';
    const [y, m, d] = f.split('-'); return [d + '/' + m, canal ? 'por ' + canal : ''].filter(Boolean).join(' · ');
  };
  const segHistorial = () => [el('div', { cls:'card' }, el('h3', {}, 'Historial'),
    r.hist.length ? r.hist.map(x => el('div', { cls:'hist' }, el('span', { cls:'cuando' }, x.fecha),
      el('b', {}, TIPO_TXT[x.tipo] || x.tipo), detalleTxt(x) ? ' · ' + detalleTxt(x) : '', x.texto ? '\n' + x.texto : '', editar(x))) : el('div', { cls:'vacio' }, 'Sin historial todavía.'))];

  const SEGMENTOS = [['contacto','Contacto',segContacto,0], ['perfil','Perfil',segPerfil,0], ['busqueda','Búsqueda',segBusqueda,mCompra.length],
    ['venta','Venta',segVenta,mVenta.length], ['agenda','Agenda',segAgenda,0], ['historial','Historial',segHistorial,0]];
  const cuerpo = el('div', { cls:'ficha-body' });
  const barra = el('div', { cls:'segmentos' });
  const vistas = {};
  // Barra fija de Guardar: dice cuántas solapas tienen cambios; el punto en cada solapa marca dónde
  const txtGuardar = el('span', { cls:'txt' });
  const barraGuardar = el('div', { cls:'guardar-fijo' }, txtGuardar, el('button', { cls:'btn pri', onclick: guardarTab }, 'Guardar'));
  const marcar = () => {
    const ks = conCambios();
    barra.querySelectorAll('button').forEach(b => b.classList.toggle('sucia', ks.includes(b.dataset.k)));
    txtGuardar.textContent = ks.length ? (ks.length === 1 ? 'Cambios en ' + SEGMENTOS.find(s => s[0] === ks[0])[1] : 'Cambios en ' + ks.length + ' solapas') : 'Sin cambios';
    barraGuardar.classList.toggle('activa', !!ks.length);
  };
  const mostrar = key => {
    segmentoActual = key; sessionStorage.setItem('crm_seg', key);
    barra.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
    if (!vistas[key]) { pend = null; vistas[key] = el('div', {}, ...SEGMENTOS.find(s => s[0] === key)[2]()); if (pend) pends[key] = pend; pend = juntar; }
    cuerpo.replaceChildren(vistas[key]);
    if (Object.keys(pends).length) cuerpo.append(barraGuardar);
    marcar(); p.scrollTop = 0;
  };
  ['input', 'change', 'click'].forEach(ev => cuerpo.addEventListener(ev, () => setTimeout(marcar, 0)));
  SEGMENTOS.forEach(([k, t, , n]) => barra.append(el('button', { 'data-k':k, onclick: () => mostrar(k) }, t, n ? el('span', { cls:'n' }, n) : '')));

  p.replaceChildren(
    el('div', { cls:'ficha-head' },
      el('div', { cls:'barra' },
        el('button', { cls:'icono', 'aria-label':'Cerrar', icon:'cerrar', onclick: cerrar }),
        el('h1', {}, String(d.NOMBRE || '').split(' - ')[0]),
        el('img', { cls:'mono', src:'../assets/nl-mono-crema.svg', alt:'NL' })),
      r.etiqueta.includes(' - ') ? el('div', { cls:'etiqueta' }, el('span', {}, r.etiqueta.split(' - ').slice(1).join(' - '))) : '',
      el('div', { cls:'estado-linea' }, el('span', { cls:'pill' }, d.ESTADO || 'Sin estado'),
        d['ETAPA COMPRA'] ? el('span', { cls:'pill' }, 'Compra: ' + (ETAPA_C_TXT[d['ETAPA COMPRA']] || d['ETAPA COMPRA'])) : '',
        d['ETAPA VENTA'] ? el('span', { cls:'pill' }, 'Venta: ' + d['ETAPA VENTA']) : ''),
      dondeEsta(d, id),
      barra),
    cuerpo);
  mostrar(segmentoActual);
  if (!p.classList.contains('abierta')) { p.classList.add('abierta'); if (!esEscritorio()) document.body.style.overflow = 'hidden'; }
}

// Dónde está en la app: en qué bloque de Hoy (sale del Hoy guardado en el dispositivo) y en qué grupo de la cartera de Contactos
const BLOQUE_TXT = { tareas:'Para hoy', respuestas:'Para hoy', visitas:'Para hoy', fechas:'Cuando tengas tiempo', fiestas:'Cuando tengas tiempo', proximos:'Para hoy', opciones:'Para hoy',
  llamar:'Leads', mensajes:'Leads', atento:'Para hoy', relacion:'Cuando tengas tiempo', revivir:'Cuando tengas tiempo' };
const ETAPA_V_TXT = { CAPTAR:'Captar', PRELISTING:'Prelisting', ACM:'ACM', 'NO CAPTADA':'No captada', 'CON OTRA INMO':'Otra inmo', 'EN PUBLICACION':'Publicando', 'EN VENTA':'En venta', RESERVA:'Reserva' };
function dondeEsta(d, id) {
  let hoy = null;
  try { const c = JSON.parse(localStorage.getItem(LS_HOY) || 'null'); if (c && c.dia === new Date().toLocaleDateString('sv')) hoy = c.r; } catch (e) {}
  const bloques = hoy ? Object.keys(BLOQUE_TXT).filter(k => (hoy[k] || []).some(x => String(x.id) === String(id))).map(k => BLOQUE_TXT[k]) : null;
  const prox = d['PROX CONTACTO'];
  const enHoy = bloques === null ? 'abrí Hoy para saberlo'
    : bloques.length ? [...new Set(bloques)].join(' y ')
    : d.ESTADO === 'DESCARTADO' ? 'no (archivado)'
    : prox && aISO(prox) > isoLocal(new Date()) ? 'no, vuelve el ' + prox.slice(0, 5) + (d['PROX DEFINIDO'] ? ' (paso tuyo)' : '')
    : 'no le toca hoy';
  // En qué filtros de la Cartera aparece (los mismos FILTROS que usa la Cartera)
  const etapa = d['ETAPA VENTA'] || '';
  const x = { nuevo: d.ESTADO === 'NUEVO', comprador: !!(d['BUSCA TIPO'] || d['BUSCA BARRIOS']), etapaC: d['ETAPA COMPRA'] || '', etapa,
    vendedor: !!(d['VENDE TIPO'] || (etapa && etapa !== 'VENDIDA') || ['VENTA','PARTE DE PAGO'].includes(d['BUSCA FORMA DE PAGO']) || ['VENDEDOR','AMBOS'].includes(d.ROL)) };
  const fuera = { 'EN PAUSA':'no (en pausa)', DESCARTADO:'no (archivado)' }[d.ESTADO] || (d.ESTADO === 'CLIENTE' && (!etapa || etapa === 'VENDIDA') ? 'no (cliente)' : '');
  const cartera = fuera || GRUPOS_CARTERA.filter(g => g[1](x)).map(g => g[0]).join(' y ') || (d.ESTADO === 'NUEVO' || !x.comprador ? 'no (lead: está en Hoy → Leads)' : 'no');
  return el('div', { cls:'donde' }, 'Hoy: ', el('b', {}, enHoy), ' · Cartera: ', el('b', {}, cartera));
}

// Con la ficha abierta en el celular, Hoy no se recalcula en cada Guardar (es el pedido más pesado y competía con el guardado):
// queda pendiente y se actualiza al cerrar la ficha. En la compu, donde Hoy se ve al lado, se actualiza en el momento.
let hoyPendiente = false;
function refrescar() {
  const enHoy = document.getElementById('tHoy').classList.contains('on'), enCartera = document.getElementById('tBuscar').classList.contains('on');
  if (!cfg().key || (!enHoy && !enCartera)) return;
  if (document.getElementById('ficha').classList.contains('abierta') && !esEscritorio()) { hoyPendiente = true; return; }
  hoyPendiente = false; if (enHoy) verHoy(); else verBuscar();
}

// Al recargar: vuelve a la ficha abierta (y su solapa). sessionStorage dura mientras la pestaña o la app esté abierta.
let desbloqueado = false;
const marcarActivo = () => { if (desbloqueado) sessionStorage.setItem('crm_activo', Date.now()); };
window.addEventListener('pagehide', marcarActivo);     // una recarga cuenta como actividad, no como salida
function arrancar() {
  desbloqueado = true; marcarActivo();
  verBuscar();
  api('api_hoy').then(r => { LINKS = r.links || {}; try { localStorage.setItem(LS_HOY, JSON.stringify({ dia: new Date().toLocaleDateString('sv'), r })); } catch (e) {} }).catch(() => {});
  const id = sessionStorage.getItem('crm_vista');
  if (id) abrir(id, sessionStorage.getItem('crm_seg') || '').catch(() => sessionStorage.removeItem('crm_vista'));
}

document.getElementById('tHoy').onclick = verHoy;
document.getElementById('tBuscar').onclick = verBuscar;
document.getElementById('tNuevo').onclick = verNuevo;
document.getElementById('bMenu').onclick = () => { armarMenu(); menu(true); };
document.getElementById('bMenu').insertAdjacentHTML('afterbegin', ICON.burger);
document.getElementById('velo').onclick = () => menu(false);
document.querySelectorAll('[data-i]').forEach(s => s.insertAdjacentHTML('afterbegin', ICON[s.dataset.i]));
const hoyTxt = new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('fecha').textContent = hoyTxt.charAt(0).toUpperCase() + hoyTxt.slice(1);

if (!cfg().url || !cfg().key) pantallaConfig();
// Face ID solo si la app estuvo cerrada o en segundo plano más de BLOQUEO_MIN; una recarga no lo pide
else if (localStorage.getItem(LS.cred) && !(Date.now() - (+sessionStorage.getItem('crm_activo') || 0) < BLOQUEO_MIN * 60000)) pantallaBloqueo();
else arrancar();
</script>
